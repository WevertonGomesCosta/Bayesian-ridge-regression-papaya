name: Refine chunk comments

on:
  push:
    branches:
      - chunk-documentation-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace mechanical comments with logical annotations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re

          CHUNK_RE = re.compile(r'^\s*```\{r(?:[\s,}]|$)')
          END_RE = re.compile(r'^\s*```\s*$')

          exact_generated = {
              '# Read the required input data.',
              '# Save the generated output.',
              '# Iterate over the analysis units.',
              '# Fit the configured BGLR model.',
              '# Join the supporting information.',
              '# Summarize the current data.',
              '# Derive the variables required at this step.',
              '# Keep the observations required for this step.',
              '# Order the results for interpretation.',
              '# Build the visualization.',
              '# Compute the association used in the evaluation.',
              '# Evaluate the matrix structure.',
              '# Organize the variables used in the output.',
              '# Apply the corresponding conditional rule.',
              '# Continue the current transformation step.',
              '# Lê os dados de entrada necessários.',
              '# Salva a saída gerada.',
              '# Percorre as unidades da análise.',
              '# Ajusta o modelo BGLR configurado.',
              '# Integra as informações auxiliares.',
              '# Resume os dados desta etapa.',
              '# Deriva as variáveis necessárias nesta etapa.',
              '# Mantém as observações necessárias nesta etapa.',
              '# Ordena os resultados para interpretação.',
              '# Constrói a visualização.',
              '# Calcula a associação usada na avaliação.',
              '# Avalia a estrutura da matriz.',
              '# Organiza as variáveis usadas na saída.',
              '# Aplica a regra condicional correspondente.',
              '# Continua a transformação desta etapa.',
          }
          generated_object_re = re.compile(r'^\s*# (?:Build the .+ object\.|Constrói o objeto .+\.)\s*$')

          def parse_chunks(lines):
              chunks = []
              i = 0
              while i < len(lines):
                  if not CHUNK_RE.match(lines[i]):
                      i += 1
                      continue
                  start = i
                  j = i + 1
                  while j < len(lines) and not END_RE.match(lines[j]):
                      j += 1
                  if j >= len(lines):
                      raise RuntimeError(f'Unclosed chunk at line {start + 1}')
                  inside = lines[start].split('{r', 1)[1].rsplit('}', 1)[0].strip()
                  label = inside.split(',', 1)[0].strip() if inside else 'unnamed'
                  chunks.append((start, j, label or 'unnamed'))
                  i = j + 1
              return chunks

          def is_generated_comment(line):
              return line.strip() in exact_generated or bool(generated_object_re.match(line))

          def start_comment(label, pt):
              key = label.lower()
              if pt:
                  mapping = [
                      (('fit-models',), 'Prepara os contêineres e percorre as combinações de característica, fold e método.'),
                      (('mcmc-settings',), 'Reúne os parâmetros MCMC em uma tabela de referência.'),
                      (('model-catalogue',), 'Define os métodos comparados, seus rótulos e a estrutura genômica usada em cada ajuste.'),
                      (('eta-specifications',), 'Define o efeito fixo de família e o componente genômico específico de cada método.'),
                      (('run-design',), 'Combina características, folds e métodos e atribui uma semente reprodutível a cada ajuste.'),
                      (('trace-specifications',), 'Mapeia os arquivos e parâmetros das cadeias usados nos diagnósticos MCMC.'),
                      (('combine-results',), 'Carrega as tabelas consolidadas produzidas pelos ajustes para os diagnósticos seguintes.'),
                      (('convergence-summary',), 'Aplica os critérios de revisão e resume os diagnósticos de convergência por método.'),
                      (('save-results',), 'Agrupa configurações, resultados e diagnósticos no objeto final do módulo.'),
                      (('preprocessing', 'clean', 'phenotype'), 'Organiza os dados fenotípicos e aplica as regras definidas para esta etapa do pré-processamento.'),
                      (('allele', 'marker', 'ssr'), 'Organiza a informação dos marcadores e calcula os diagnósticos necessários nesta etapa.'),
                      (('matrix', 'matrices', 'relationship', 'genomic'), 'Constrói ou verifica as matrizes usadas na predição genômica.'),
                      (('fold', 'cross-validation'), 'Constrói ou resume a estrutura dos folds da validação cruzada.'),
                      (('selection', 'ranking', 'candidate'), 'Deriva os rankings ou resumos de seleção a partir dos resultados preditivos.'),
                      (('runtime',), 'Resume o custo computacional dos métodos avaliados.'),
                      (('heritability',), 'Calcula e organiza o resumo de herdabilidade baseado no modelo RR-BLUP/BRR.'),
                      (('correlation',), 'Calcula as correlações usadas para comparar características ou resultados.'),
                      (('plot', 'figure'), 'Constrói a visualização usada para interpretar os resultados desta seção.'),
                      (('table', 'summary', 'preview'), 'Monta a tabela-resumo apresentada nesta seção.'),
                  ]
                  for keys, text in mapping:
                      if any(k in key for k in keys):
                          return '# ' + text
                  return '# Executa o bloco de cálculo correspondente a esta etapa do módulo.'
              else:
                  mapping = [
                      (('fit-models',), 'Prepare the result containers and iterate over trait, fold, and method combinations.'),
                      (('mcmc-settings',), 'Collect the MCMC settings in a reference table.'),
                      (('model-catalogue',), 'Define the compared methods, display labels, and genomic structure used by each fit.'),
                      (('eta-specifications',), 'Define the fixed family effect and the method-specific genomic component.'),
                      (('run-design',), 'Combine traits, folds, and methods and assign a reproducible seed to each fit.'),
                      (('trace-specifications',), 'Map the chain files and parameters used in the MCMC diagnostics.'),
                      (('combine-results',), 'Load the consolidated fitting tables used by the downstream diagnostics.'),
                      (('convergence-summary',), 'Apply the review criteria and summarize convergence diagnostics by method.'),
                      (('save-results',), 'Collect settings, results, and diagnostics in the final module object.'),
                      (('preprocessing', 'clean', 'phenotype'), 'Organize the phenotype data and apply the preprocessing rules defined for this stage.'),
                      (('allele', 'marker', 'ssr'), 'Organize marker information and compute the diagnostics required at this stage.'),
                      (('matrix', 'matrices', 'relationship', 'genomic'), 'Build or check the matrices used for genomic prediction.'),
                      (('fold', 'cross-validation'), 'Build or summarize the cross-validation fold structure.'),
                      (('selection', 'ranking', 'candidate'), 'Derive selection rankings or summaries from the predictive results.'),
                      (('runtime',), 'Summarize the computational cost of the evaluated methods.'),
                      (('heritability',), 'Compute and organize the RR-BLUP/BRR model-based heritability summary.'),
                      (('correlation',), 'Compute the correlations used to compare traits or results.'),
                      (('plot', 'figure'), 'Build the visualization used to interpret the results in this section.'),
                      (('table', 'summary', 'preview'), 'Assemble the summary table presented in this section.'),
                  ]
                  for keys, text in mapping:
                      if any(k in key for k in keys):
                          return '# ' + text
                  return '# Execute the calculation block corresponding to this stage of the module.'

          def object_comment(lhs, pt):
              key = lhs.lower()
              pretty = lhs.replace('_', ' ')
              if pt:
                  if any(k in key for k in ('path', 'file', 'dir')):
                      return f'# Define o caminho ou local associado a `{lhs}`.'
                  if any(k in key for k in ('metric', 'performance', 'accuracy')):
                      return '# Calcula e organiza as métricas de desempenho preditivo.'
                  if 'prediction' in key or 'predicted' in key:
                      return '# Organiza as predições necessárias para a avaliação.'
                  if any(k in key for k in ('genomic_value', 'genomic_component')):
                      return '# Organiza o componente genômico estimado para cada indivíduo.'
                  if any(k in key for k in ('trace', 'chain', 'geweke', 'ess', 'convergence')):
                      return '# Prepara as informações usadas nos diagnósticos das cadeias MCMC.'
                  if any(k in key for k in ('summary', 'table')):
                      return f'# Resume os resultados no objeto `{lhs}`.'
                  if any(k in key for k in ('selection', 'ranking', 'candidate', 'recurrence')):
                      return '# Deriva a estrutura usada para priorizar ou resumir os candidatos.'
                  if any(k in key for k in ('fold', 'run_design')):
                      return '# Organiza a estrutura da validação cruzada e dos ajustes.'
                  if any(k in key for k in ('frequency', 'allele')):
                      return '# Calcula ou organiza as frequências alélicas usadas nesta etapa.'
                  if lhs in ('M', 'G', 'X', 'X_fixed') or 'matrix' in key:
                      return f'# Constrói ou organiza a matriz `{lhs}` usada no modelo.'
                  if 'phenotype' in key:
                      return '# Organiza os fenótipos usados na análise.'
                  if 'metadata' in key:
                      return '# Organiza os metadados dos indivíduos.'
                  if key.startswith('eta') or 'family_term' in key:
                      return '# Define os componentes que entram no preditor do BGLR.'
                  return f'# Cria `{lhs}` para uso nas etapas seguintes deste bloco.'
              else:
                  if any(k in key for k in ('path', 'file', 'dir')):
                      return f'# Define the path or location associated with `{lhs}`.'
                  if any(k in key for k in ('metric', 'performance', 'accuracy')):
                      return '# Compute and organize predictive-performance metrics.'
                  if 'prediction' in key or 'predicted' in key:
                      return '# Organize the predictions required for evaluation.'
                  if any(k in key for k in ('genomic_value', 'genomic_component')):
                      return '# Organize the estimated genomic component for each individual.'
                  if any(k in key for k in ('trace', 'chain', 'geweke', 'ess', 'convergence')):
                      return '# Prepare the information used in the MCMC chain diagnostics.'
                  if any(k in key for k in ('summary', 'table')):
                      return f'# Summarize the results in `{lhs}`.'
                  if any(k in key for k in ('selection', 'ranking', 'candidate', 'recurrence')):
                      return '# Derive the structure used to prioritize or summarize candidates.'
                  if any(k in key for k in ('fold', 'run_design')):
                      return '# Organize the cross-validation and fitting structure.'
                  if any(k in key for k in ('frequency', 'allele')):
                      return '# Compute or organize allele frequencies used at this stage.'
                  if lhs in ('M', 'G', 'X', 'X_fixed') or 'matrix' in key:
                      return f'# Build or organize the `{lhs}` matrix used by the model.'
                  if 'phenotype' in key:
                      return '# Organize the phenotypes used in the analysis.'
                  if 'metadata' in key:
                      return '# Organize individual-level metadata.'
                  if key.startswith('eta') or 'family_term' in key:
                      return '# Define the components included in the BGLR predictor.'
                  return f'# Create `{lhs}` for use in the following steps of this block.'

          def line_comment(line, label, pt):
              s = line.strip()
              low = s.lower()
              m = re.match(r'^([A-Za-z][A-Za-z0-9_.]*)\s*<-', s)
              if m:
                  return object_comment(m.group(1), pt)
              if low.startswith(('for (', 'for(')):
                  if 'fit-models' in label.lower():
                      return '# Percorre as 350 combinações de característica, fold e método.' if pt else '# Iterate over the 350 trait, fold, and method combinations.'
                  return '# Percorre os elementos necessários para construir este resultado.' if pt else '# Iterate over the elements required to build this result.'
              if low.startswith(('if (', 'if(')):
                  return '# Trata a condição específica antes de prosseguir com o cálculo.' if pt else '# Handle the specific condition before continuing the calculation.'
              if re.match(r'^(write\.csv|write_csv|saveRDS|ggsave)\s*\(', s):
                  return '# Salva a saída consolidada para uso posterior.' if pt else '# Save the consolidated output for downstream use.'
              if re.match(r'^(data\.frame|tibble)\s*\(', s):
                  return '# Monta a tabela apresentada nesta seção.' if pt else '# Assemble the table presented in this section.'
              if re.match(r'^kable\s*\(', s):
                  return '# Formata a tabela para exibição no tutorial.' if pt else '# Format the table for display in the tutorial.'
              if 'ggplot(' in low:
                  return '# Constrói o gráfico usado na interpretação.' if pt else '# Build the figure used for interpretation.'
              nm = re.match(r'^([A-Za-z][A-Za-z0-9_.]*)\s*=\s*(?:c|list|data\.frame|tibble)\s*\(', s)
              if nm:
                  name = nm.group(1)
                  if name.lower() in ('valor', 'value', 'values'):
                      return '# Lista os valores correspondentes aos itens da tabela.' if pt else '# List the values corresponding to the table entries.'
                  return f'# Organiza o componente `{name}` desta estrutura.' if pt else f'# Organize the `{name}` component of this structure.'
              return start_comment(label, pt)

          def candidate(line):
              if not line.strip() or line.lstrip().startswith('#'):
                  return False
              indent = len(line) - len(line.lstrip())
              if indent > 4:
                  return False
              s = line.strip()
              if re.match(r'^[A-Za-z][A-Za-z0-9_.]*\s*<-', s):
                  return True
              if s.startswith(('for (', 'for(', 'if (', 'if(')):
                  return True
              if re.match(r'^(write\.csv|write_csv|saveRDS|ggsave|data\.frame|tibble|kable)\s*\(', s):
                  return True
              if 'ggplot(' in s.lower():
                  return True
              if re.match(r'^[A-Za-z][A-Za-z0-9_.]*\s*=\s*(?:c|list|data\.frame|tibble)\s*\(', s):
                  return True
              return False

          def annotate_body(body, label, pt):
              # Remove only comments produced by the first automated pass.
              body = [line for line in body if not is_generated_comment(line)]
              code_positions = [i for i, line in enumerate(body) if line.strip() and not line.lstrip().startswith('#')]
              code_n = len(code_positions)
              if code_n < 15:
                  return body

              required = max(2, math.ceil(code_n / 15))
              inserts = {}

              # Always orient the reader at the beginning of a large chunk unless
              # an existing explanatory code comment already does so.
              first_code = code_positions[0]
              ordinary_before = any(
                  line.lstrip().startswith('#') and not line.lstrip().startswith('#|')
                  for line in body[:first_code + 1]
              )
              if not ordinary_before:
                  inserts[first_code] = start_comment(label, pt)

              # Track existing comments by code-line ordinal.
              comment_ordinals = [0] if first_code in inserts else []
              ordinal = 0
              for i, line in enumerate(body):
                  if line.strip() and not line.lstrip().startswith('#'):
                      ordinal += 1
                  elif line.lstrip().startswith('#') and not line.lstrip().startswith('#|'):
                      comment_ordinals.append(max(0, ordinal - 1))

              # Candidate positions are logical block boundaries, never arbitrary
              # entries deep inside vectors or function arguments.
              candidates = []
              ordinal = 0
              for i, line in enumerate(body):
                  if line.strip() and not line.lstrip().startswith('#'):
                      if candidate(line):
                          candidates.append((ordinal, i))
                      ordinal += 1

              selected_ordinals = set(comment_ordinals)
              needed = max(0, required - len(selected_ordinals))
              for k in range(1, needed + 1):
                  target = round(k * code_n / (needed + 1))
                  available = [(abs(o - target), o, i) for o, i in candidates if o not in selected_ordinals and i not in inserts]
                  if not available:
                      break
                  _, o, i = min(available)
                  inserts[i] = line_comment(body[i], label, pt)
                  selected_ordinals.add(o)

              # If a very long region remains without a comment, insert at the
              # nearest subsequent logical boundary.
              all_points = sorted(selected_ordinals)
              while True:
                  points = [0] + all_points + [code_n]
                  gaps = [(points[j + 1] - points[j], points[j], points[j + 1]) for j in range(len(points) - 1)]
                  gap, left, right = max(gaps)
                  if gap <= 20:
                      break
                  target = (left + right) // 2
                  available = [(abs(o - target), o, i) for o, i in candidates if left < o < right and o not in selected_ordinals and i not in inserts]
                  if not available:
                      break
                  _, o, i = min(available)
                  inserts[i] = line_comment(body[i], label, pt)
                  selected_ordinals.add(o)
                  all_points = sorted(selected_ordinals)

              out = []
              for i, line in enumerate(body):
                  if i in inserts:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + inserts[i])
                  out.append(line)
              return out

          for path in sorted(Path('analysis').glob('0[1-5]*.Rmd')):
              lines = path.read_text(encoding='utf-8').splitlines()
              pt = path.name.endswith('_pt.Rmd')
              for start, end, label in reversed(parse_chunks(lines)):
                  body = lines[start + 1:end]
                  new_body = annotate_body(body, label, pt)
                  lines[start + 1:end] = new_body
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Audit prose and comment coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import re

          CHUNK_RE = re.compile(r'^\s*```\{r(?:[\s,}]|$)')
          END_RE = re.compile(r'^\s*```\s*$')
          HEADING_RE = re.compile(r'^\s*#{1,6}\s+')
          WORD_RE = re.compile(r'[A-Za-zÀ-ÖØ-öø-ÿ]{2,}')
          failures = []
          total = large = 0

          for path in sorted(Path('analysis').glob('*.Rmd')):
              lines = path.read_text(encoding='utf-8').splitlines()
              i = 0
              prev_end = -1
              while i < len(lines):
                  if not CHUNK_RE.match(lines[i]):
                      i += 1
                      continue
                  start = i
                  j = i + 1
                  while j < len(lines) and not END_RE.match(lines[j]):
                      j += 1
                  total += 1

                  prose = False
                  for x in lines[prev_end + 1:start]:
                      s = x.strip()
                      if not s or HEADING_RE.match(s):
                          continue
                      if s.startswith(('```', '<!--', '-->', '<div', '</div', '$$', '\\[', '\\]', '---', '|', ':--')):
                          continue
                      if len(WORD_RE.findall(s)) >= 5:
                          prose = True
                          break
                  if not prose:
                      failures.append(f'{path}:{start+1}: missing explanatory prose')

                  body = lines[start + 1:j]
                  code_n = sum(1 for x in body if x.strip() and not x.lstrip().startswith('#'))
                  if code_n >= 15:
                      large += 1
                      comments = sum(1 for x in body if x.lstrip().startswith('#') and not x.lstrip().startswith('#|'))
                      required = max(2, math.ceil(code_n / 15))
                      if comments < required:
                          failures.append(f'{path}:{start+1}: comments={comments}, required={required}')
                  prev_end = j
                  i = j + 1

          print(f'Audited chunks: {total}; large chunks: {large}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('PASS: prose precedes every chunk and all large chunks contain multiple logical comments.')
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse every R chunk and commit
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- list.files('analysis', pattern = '\\.Rmd$', full.names = TRUE)
          n <- 0L
          for (f in files) {
            x <- readLines(f, warn = FALSE, encoding = 'UTF-8')
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl = TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s + 1L):length(x)], perl = TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + e_rel
              code <- if (e > s + 1L) x[(s + 1L):(e - 1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text = code)
              n <- n + 1L
            }
          }
          stopifnot(n == 217L)
          cat('Parsed R chunks:', n, '\n')
          RS

          git diff --check
          rm -f .github/workflows/refine-chunk-comments.yml

          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {f'analysis/{m}_{lang}.Rmd' for m in ['01_preprocessing','02_matrices','03_models','04_results','05_results'] for lang in ['en','pt']}
          allowed.add('.github/workflows/refine-chunk-comments.yml')
          bad = [p for p in changed if p not in allowed]
          if bad:
              raise SystemExit('Unexpected files:\n' + '\n'.join(bad))
          PY

          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add -A
          git commit -m "Refine tutorial code comments"
          git push origin HEAD:chunk-documentation-audit
