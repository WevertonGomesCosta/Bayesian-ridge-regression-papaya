name: Scan residual meta text M01 M02

on:
  push:
    branches:
      - didactic-content-cleanup-m01-m02

jobs:
  scan:
    if: github.event.head_commit.message == 'Scan residual meta text M01 M02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-content-cleanup-m01-m02
      - name: Scan suspicious editorial terms
        shell: bash
        run: |
          echo '=== PT/EN suspicious terms ==='
          grep -niE 'tutorial|apresenta[cç][aã]o|presentation|p[aá]gina|page|helper|chunk|renderiza|rendering|reader|leitor' \
            analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd \
            analysis/02_matrices_pt.Rmd analysis/02_matrices_en.Rmd || true
