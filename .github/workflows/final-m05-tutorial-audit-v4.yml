name: Final Module 05 tutorial audit v4

on:
  push:
    branches: [final-m05-tutorial-audit]
    paths: ['.github/workflows/final-m05-tutorial-audit-v4.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected Module 05 transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap
          yml = Path('.github/workflows/final-m05-tutorial-audit.yml').read_text(encoding='utf-8')
          m = re.search(r"python - <<'PY'\n(.*?)\n          PY", yml, flags=re.S)
          if not m:
              raise SystemExit('Embedded transformation not found')
          code = textwrap.dedent(m.group(1))
          old = """for old,new,label in pt_repls:\n    pt = replace_once(pt,old,new,label)\nfor old,new,label in en_repls:\n    en = replace_once(en,old,new,label)"""
          new = """for i,item in enumerate(pt_repls, 1):\n    old,new = item[:2]\n    label = item[2] if len(item) > 2 else f'pt replacement {i}'\n    if i in (19,20) and pt.count(old) == 0:\n        continue\n    pt = replace_once(pt,old,new,label)\nfor i,item in enumerate(en_repls, 1):\n    old,new = item[:2]\n    label = item[2] if len(item) > 2 else f'en replacement {i}'\n    en = replace_once(en,old,new,label)"""
          if code.count(old) != 1:
              raise SystemExit(f'Expected one loop target, found {code.count(old)}')
          code = code.replace(old, new, 1)
          exec(compile(code, '<module05-audit>', 'exec'), {})

          p = Path('analysis/05_results_pt.Rmd')
          text = p.read_text(encoding='utf-8')
          old_rec = """A recorrência resume, entre as características com correlação OOF positiva, em quantas
cada indivíduo aparece entre os 20% mais favoráveis. Recorrências que dependam de sinais OOF positivos fracos devem permanecer exploratórias. `N_traits`, frequência de seleção e rankings
não são combinados em um índice multicaracterística."""
          new_rec = """Recorrência resume, entre as características com correlação OOF positiva, em quantas listas cada indivíduo aparece entre os 20% mais favoráveis. `Selection_frequency` usa como denominador o número de características com OOF positivo, não necessariamente as dez características originais. Recorrência sustentada por sinais OOF positivos fracos permanece exploratória. `N_traits`, frequência e rankings não são combinados em um índice multicaracterística; portanto, maior recorrência não demonstra superioridade conjunta em múltiplas características."""
          if text.count(old_rec) != 1:
              raise SystemExit(f'PT recurrence exact target count: {text.count(old_rec)}')
          text = text.replace(old_rec, new_rec, 1)
          old_sum = """As tabelas e figuras deste módulo permitem acompanhar a sequência completa da
comparação dos métodos até a identificação dos indivíduos recorrentes. A
interpretação biológica deve considerar conjuntamente a evidência preditiva, a
direção de seleção e as limitações da população e do conjunto de marcadores."""
          new_sum = """A leitura final deve manter a hierarquia estabelecida ao longo do tutorial: desempenho OOF orienta a comparação preditiva; DIC, estabilidade entre folds e diagnósticos MCMC fornecem contexto complementar; rankings são produzidos apenas quando a direção OOF é positiva; e recorrência resume sobreposição entre rankings sem criar um índice multicaracterística. Todas as conclusões permanecem condicionadas à população de melhoramento representada, ao painel SSR disponível e ao desenho transdutivo da validação. Para uso operacional em seleção, os rankings OOF devem ser entendidos como evidência exploratória e não como substitutos de valores genéticos finais obtidos em uma etapa de predição destinada à decisão."""
          if text.count(old_sum) != 1:
              raise SystemExit(f'PT summary exact target count: {text.count(old_sum)}')
          text = text.replace(old_sum, new_sum, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Parse Module 05 chunks and inline R
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/05_results_pt.Rmd','analysis/05_results_en.Rmd')
          n_chunks <- 0L; n_inline <- 0L
          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            inside <- FALSE; prose <- character()
            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl=TRUE)) { inside <- TRUE; next }
              if (inside && grepl('^\\s*```\\s*$', line, perl=TRUE)) { inside <- FALSE; next }
              if (!inside) prose <- c(prose,line)
            }
            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl=TRUE)))
            if (length(inline)) for (expr in inline) {
              code <- sub('^`r ', '', expr); code <- sub('`$', '', code); parse(text=code); n_inline <- n_inline + 1L
            }
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(rel)) stop('Unclosed chunk in ',f,' at line ',s)
              e <- s + rel
              code <- if (e > s+1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code); n_chunks <- n_chunks + 1L
            }
          }
          cat('Parsed Module 05 R chunks:', n_chunks, '\n')
          cat('Parsed Module 05 inline R expressions:', n_inline, '\n')
          RS

      - name: Commit only Module 05 source files
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' analysis/05_results_en.Rmd analysis/05_results_pt.Rmd | sort)"
          test "$changed" = "$expected"
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/05_results_pt.Rmd analysis/05_results_en.Rmd
          git commit -m "Refine Module 05 tutorial presentation"
          git push origin HEAD:final-m05-tutorial-audit
