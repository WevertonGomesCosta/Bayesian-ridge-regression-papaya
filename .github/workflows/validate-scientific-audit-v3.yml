name: Validate scientific audit v3

on:
  push:
    branches:
      - scientific-product-audit

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scientific-product-audit
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Extract chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'analysis/02_matrices_en.Rmd', 'analysis/02_matrices_pt.Rmd',
              'analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd',
              'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd',
          ]
          out = Path('.audit-r-v3'); out.mkdir(exist_ok=True)
          for f in files:
              lines = Path(f).read_text(encoding='utf-8').splitlines()
              chunks=[]; current=None; start=None; label=None
              for i,line in enumerate(lines,1):
                  s=line.strip()
                  if current is None and s.startswith('```{r') and s.endswith('}'):
                      current=[]; start=i+1; label=s; continue
                  if current is not None and s=='```':
                      chunks.append((label,start,current)); current=None; continue
                  if current is not None: current.append(line)
              if current is not None: raise RuntimeError(f'Unclosed R chunk in {f}')
              for j,(lab,st,code) in enumerate(chunks,1):
                  p=out/f'{Path(f).stem}__{j:02d}.R'
                  p.write_text('\n'.join(code)+'\n',encoding='utf-8')
              print(f'{f}: {len(chunks)} chunks')
          PY

      - name: Parse all chunks in one clean R session
        shell: bash
        run: |
          Rscript --vanilla -e '
            files <- list.files(".audit-r-v3", pattern="[.]R$", full.names=TRUE)
            stopifnot(length(files) > 0)
            for (f in files) {
              tryCatch(parse(file=f), error=function(e) {
                cat("PARSE FAILURE:", f, "\n", conditionMessage(e), "\n")
                quit(status=1)
              })
            }
            cat("Parsed", length(files), "R chunks successfully.\n")
          '

      - name: Validate scientific invariants and diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sources='\n'.join(Path(p).read_text(encoding='utf-8') for p in [
            'analysis/03_models_en.Rmd','analysis/03_models_pt.Rmd',
            'analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd',
            'analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd'])
          forbidden=['positive_p_lt_0.05','positive_p_ge_0.05','nonpositive_p_ge_0.05',
            'automatic_supported','rrblup_preferred_among_equivalent_models',
            'best_non_rrblup_equivalent_model','showed numerical instability',
            'apresentar instabilidade numérica']
          bad=[x for x in forbidden if x in sources]
          if bad: raise RuntimeError(f'Forbidden residues: {bad}')
          for p in ['analysis/03_models_en.Rmd','analysis/03_models_pt.Rmd']:
            t=Path(p).read_text(encoding='utf-8')
            for c in ['fit-models','assemble-fit-results','save-results']:
              if f'```{{r {c}, eval=FALSE}}' not in t: raise RuntimeError(f'{p}: {c} not protected')
          for p in ['analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd']:
            t=Path(p).read_text(encoding='utf-8')
            for x in ['OOF_predictive_direction','filter(OOF_predictive_direction == "positive")',
              'selection_eligible_traits','DIC_COMPETITIVE_THRESHOLD','Operational_competitive_set_rule']:
              if x not in t: raise RuntimeError(f'{p}: missing {x}')
          for p in ['analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd']:
            if 'm04$selection_eligible_traits' not in Path(p).read_text(encoding='utf-8'):
              raise RuntimeError(f'{p}: M04/M05 interface mismatch')
          print('Scientific invariants passed.')
          PY
          git diff --check main...HEAD
          changed="$(git diff --name-only main...HEAD | grep -v '^.github/workflows/' | sort)"
          expected="$(printf '%s\n' README.md analysis/02_matrices_en.Rmd analysis/02_matrices_pt.Rmd analysis/03_models_en.Rmd analysis/03_models_pt.Rmd analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd | sort)"
          test "$changed" = "$expected"

      - name: Remove validation workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/validate-scientific-audit.yml .github/workflows/validate-scientific-audit-v2.yml .github/workflows/validate-scientific-audit-v3.yml
          git commit -m "Complete scientific source validation"
          git pull --rebase origin scientific-product-audit
          git push origin HEAD:scientific-product-audit
