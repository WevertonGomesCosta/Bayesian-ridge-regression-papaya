name: Fix inline R literal

on:
  push:
    branches:
      - fix-inline-r-literal
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace ambiguous inline R literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('analysis/04_results_pt.Rmd'),
              Path('analysis/04_results_en.Rmd'),
          ]
          old = '`r > 0`'
          new = '$r > 0$'

          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          leftovers = []
          for path in Path('analysis').glob('*.Rmd'):
              if old in path.read_text(encoding='utf-8'):
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError('Ambiguous inline R literal remains in: ' + ', '.join(leftovers))

          print('PASS: ambiguous literal replaced in PT/EN and absent from all analysis Rmd files.')
          PY
          git diff --check

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Validate R chunks and inline R syntax
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- list.files('analysis', pattern='\\.Rmd$', full.names=TRUE)
          n_chunks <- 0L
          n_inline <- 0L

          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            inside <- FALSE
            prose <- character()

            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl=TRUE)) {
                inside <- TRUE
                next
              }
              if (inside && grepl('^\\s*```\\s*$', line, perl=TRUE)) {
                inside <- FALSE
                next
              }
              if (!inside) prose <- c(prose, line)
            }

            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl=TRUE)))
            if (length(inline)) {
              for (expr in inline) {
                parse(text=substr(expr, 4L, nchar(expr) - 1L))
                n_inline <- n_inline + 1L
              }
            }

            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + e_rel
              code <- if (e > s + 1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code)
              n_chunks <- n_chunks + 1L
            }
          }

          cat('Parsed R chunks:', n_chunks, '\n')
          cat('Parsed inline R expressions:', n_inline, '\n')
          RS

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-inline-r-literal.yml

          changed=$(git diff --name-only)
          echo "$changed"

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'analysis/04_results_pt.Rmd',
              'analysis/04_results_en.Rmd',
              '.github/workflows/fix-inline-r-literal.yml',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add -A
          git commit -m "Fix literal correlation condition in R Markdown"
          git push origin HEAD:fix-inline-r-literal
