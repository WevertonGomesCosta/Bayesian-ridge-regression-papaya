name: Repair Module 01 audit inline validator

on:
  push:
    branches:
      - final-m01-tutorial-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair inline R parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/final-m01-tutorial-audit.yml')
          text = path.read_text(encoding='utf-8')
          old = "                parse(text=sub('^`r |`$', '', expr))"
          new = "                expr_code <- sub('^`r ', '', expr)\n                expr_code <- sub('`$', '', expr_code)\n                parse(text=expr_code)"
          if text.count(old) != 1:
              raise RuntimeError(f'validator anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit repaired validator and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/patch-final-m01-audit.yml
          rm -f .github/workflows/patch-final-m01-audit-v2.yml
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add -A
          git commit -m "Repair Module 01 inline validation"
          git push origin HEAD:final-m01-tutorial-audit
