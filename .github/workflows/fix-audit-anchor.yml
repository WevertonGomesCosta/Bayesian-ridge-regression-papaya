name: Fix audit anchor

on:
  push:
    branches:
      - scientific-product-audit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scientific-product-audit
      - name: Fix heading anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('analysis/02_matrices_pt.Rmd')
          text = path.read_text(encoding='utf-8')
          old = '## 11. Diagnóstico das matrizes construídas\n'
          new = '## 11. Diagnósticos das matrizes construídas\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one heading, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/02_matrices_pt.Rmd
          git rm .github/workflows/fix-audit-anchor.yml
          git commit -m "Normalize matrix diagnostics heading"
          git push origin HEAD:scientific-product-audit
