name: Refine OOF ranking interpretation v3

on:
  push:
    branches:
      - refine-oof-ranking-interpretation

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-oof-ranking-interpretation
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Refine Modules 04 and 05
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, label, path, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f'{path} / {label}: expected 1 match, found {n}')
              return out

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # ---------------- Module 04 EN ----------------
          path = 'analysis/04_results_en.Rmd'
          t = Path(path).read_text(encoding='utf-8')
          t = t.replace('selection_eligible_traits', 'positive_oof_traits')
          t = t.replace('selection-eligible traits', 'traits with positive OOF correlation')
          t = t.replace('supported traits', 'traits with positive OOF correlation')
          t = t.replace('supported trait', 'trait with positive OOF correlation')
          t = sub1(t,
              r'Finally, the selected method, predictive and DIC winners, and the descriptive\npredictive-evidence classification are brought together for each trait\.',
              'Finally, the selected method, predictive and DIC winners, OOF direction, and a\nnominal signal class are brought together for each trait. The nominal class is\nreported only to make weak positive correlations explicit; it is not used as a\nselection gate.', 'final description', path)
          t = sub1(t,
              r'(OOF_predictive_direction = if_else\(\n\s*r > 0,\n\s*"positive",\n\s*"nonpositive"\n\s*\))',
              r'\1,\n    OOF_nominal_signal = case_when(\n      r > 0 & p_value < 0.05 ~ "positive_nominal_p_lt_0.05",\n      r > 0 ~ "positive_nominal_p_ge_0.05",\n      TRUE ~ "nonpositive"\n    )',
              'nominal signal', path)
          t = sub1(t,
              r'Selection_status, OOF_predictive_direction\n',
              'Selection_status, OOF_predictive_direction, OOF_nominal_signal\n',
              'model table signal', path)
          t = sub1(t,
              r'model_selection \|>\n\s*select\(Trait, Selected_method, OOF_predictive_direction\),',
              'model_selection |>\n      select(\n        Trait, Selected_method, OOF_predictive_direction,\n        OOF_nominal_signal, r, p_value\n      ),',
              'OOF join', path)
          t = sub1(t,
              r'IND, Trait, Fold, Method, OOF_predictive_direction,\n\s*Selection_objective, Ranking_rule,\n\s*Genomic_value = Genomic_component',
              'IND, Trait, Fold, Method, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r = r, OOF_nominal_p_value = p_value,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component',
              'OOF output fields', path)
          t = t.replace('## 10. Proportional selection by trait',
                        '## 10. Exploratory proportional candidate ranking by trait')
          t = sub1(t,
              r'(## 10\. Exploratory proportional candidate ranking by trait\n\n).*?(\n\n```\{r genomic-ranking\})',
              r'\1Candidate rankings are shown for traits whose selected method has positive OOF\ncorrelation. Nominal p-values remain descriptive and do not determine whether a\nranking is produced. Positive correlations with nominal `p >= 0.05` are kept\nexplicitly as weak/exploratory signals and should not be interpreted as\ndemonstrated predictive utility. Within each positive-OOF trait, the 20% of\nindividuals with the largest oriented score are listed; this 20% is a\nconfigurable tutorial rule, not an estimated optimal selection intensity. For\ntraits whose objective is to decrease, the score is the negative genomic value.\2',
              'section 10 prose', path, re.S)
          t = sub1(t,
              r'Genomic_value, Selection_score, OOF_predictive_direction,\n\s*Selection_proportion, N_available, N_selected',
              'Genomic_value, Selection_score, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r, OOF_nominal_p_value,\n    Selection_proportion, N_available, N_selected',
              'candidate fields', path)
          t = t.replace('Number of individuals selected for each trait with positive OOF correlation',
                        'Exploratory candidate-ranking size for each positive-OOF trait')
          t = t.replace('Top five individuals in the ranking for each trait with positive OOF correlation',
                        'Top five candidates in each positive-OOF trait ranking')
          t = sub1(t,
              r'(## 11\. Recurrence across traits\n\n).*?(\n\n```\{r multitrait-recurrence\})',
              r'\1Recurrence is descriptive: among traits with positive OOF correlation, it counts\nhow many place each individual among the most favorable 20%. Weak positive OOF\nsignals remain exploratory. No weights are used and no multi-trait selection\nindex is constructed.\2',
              'recurrence prose', path, re.S)
          write(path, t)

          # ---------------- Module 04 PT ----------------
          path = 'analysis/04_results_pt.Rmd'
          t = Path(path).read_text(encoding='utf-8')
          t = t.replace('selection_eligible_traits', 'positive_oof_traits')
          t = t.replace('características elegíveis para seleção', 'características com correlação OOF positiva')
          t = t.replace('características elegíveis para\nseleção', 'características com correlação OOF positiva')
          t = t.replace('característica elegível para seleção', 'característica com correlação OOF positiva')
          t = sub1(t,
              r'Por fim, são reunidos o método selecionado, os vencedores preditivo e por DIC e\na classificação descritiva da evidência preditiva de cada característica\.',
              'Por fim, são reunidos o método selecionado, os vencedores preditivo e por DIC, a\ndireção OOF e uma classe nominal do sinal de cada característica. A classe\nnominal é apresentada apenas para tornar explícitas correlações positivas\nfracas; ela não é usada como filtro de seleção.', 'descrição final', path)
          t = sub1(t,
              r'(OOF_predictive_direction = if_else\(\n\s*r > 0,\n\s*"positive",\n\s*"nonpositive"\n\s*\))',
              r'\1,\n    OOF_nominal_signal = case_when(\n      r > 0 & p_value < 0.05 ~ "positive_nominal_p_lt_0.05",\n      r > 0 ~ "positive_nominal_p_ge_0.05",\n      TRUE ~ "nonpositive"\n    )',
              'classe nominal', path)
          t = sub1(t,
              r'Selection_status, OOF_predictive_direction\n',
              'Selection_status, OOF_predictive_direction, OOF_nominal_signal\n',
              'sinal na tabela', path)
          t = sub1(t,
              r'model_selection \|>\n\s*select\(Trait, Selected_method, OOF_predictive_direction\),',
              'model_selection |>\n      select(\n        Trait, Selected_method, OOF_predictive_direction,\n        OOF_nominal_signal, r, p_value\n      ),',
              'junção OOF', path)
          t = sub1(t,
              r'IND, Trait, Fold, Method, OOF_predictive_direction,\n\s*Selection_objective, Ranking_rule,\n\s*Genomic_value = Genomic_component',
              'IND, Trait, Fold, Method, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r = r, OOF_nominal_p_value = p_value,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component',
              'campos OOF', path)
          t = t.replace('## 10. Seleção proporcional por característica',
                        '## 10. Ranking exploratório proporcional de candidatos por característica')
          t = sub1(t,
              r'(## 10\. Ranking exploratório proporcional de candidatos por característica\n\n).*?(\n\n```\{r genomic-ranking\})',
              r'\1Os rankings de candidatos são apresentados para as características cujo método\nselecionado possui correlação OOF positiva. Os p-valores nominais permanecem\ndescritivos e não determinam se um ranking é produzido. Correlações positivas\ncom `p >= 0,05` são mantidas explicitamente como sinais fracos/exploratórios e\nnão devem ser interpretadas como utilidade preditiva demonstrada. Em cada\ncaracterística com OOF positivo, são listados os 20% de indivíduos com maior\nescore orientado; essa proporção é uma regra configurável do tutorial, e não\numa intensidade ótima estimada. Para características cujo objetivo é diminuir,\no escore é o negativo do valor genômico.\2',
              'texto da seção 10', path, re.S)
          t = sub1(t,
              r'Genomic_value, Selection_score, OOF_predictive_direction,\n\s*Selection_proportion, N_available, N_selected',
              'Genomic_value, Selection_score, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r, OOF_nominal_p_value,\n    Selection_proportion, N_available, N_selected',
              'campos de candidatos', path)
          t = t.replace('Número de indivíduos selecionados por característica com correlação OOF positiva',
                        'Tamanho do ranking exploratório de candidatos por característica com OOF positivo')
          t = t.replace('Cinco primeiros indivíduos do ranking em cada característica com correlação OOF positiva',
                        'Cinco primeiros candidatos do ranking em cada característica com OOF positivo')
          t = sub1(t,
              r'(## 11\. Recorrência entre características\n\n).*?(\n\n```\{r multitrait-recurrence\})',
              r'\1A recorrência é descritiva: entre as características com correlação OOF positiva,\nconta em quantas cada indivíduo aparece entre os 20% mais favoráveis. Sinais OOF\npositivos fracos permanecem exploratórios. Não são usados pesos e não é\nconstruído índice de seleção multicaracterística.\2',
              'texto da recorrência', path, re.S)
          write(path, t)

          # ---------------- Module 05 EN ----------------
          path = 'analysis/05_results_en.Rmd'
          t = Path(path).read_text(encoding='utf-8')
          t = t.replace('selection_eligible_traits', 'positive_oof_traits')
          t = t.replace('selection-eligible traits', 'traits with positive OOF correlation')
          t = t.replace('## 10. Proportional selection by trait',
                        '## 10. Exploratory proportional candidate ranking by trait')
          t = sub1(t,
              r'(## 10\. Exploratory proportional candidate ranking by trait\n\n).*?(\n\n```\{r proportional-selection-table\})',
              r'\1Candidate rankings are presented for traits whose selected method has positive\nOOF correlation. Nominal p-values are descriptive and do not determine whether\na ranking is shown. Rankings with nominal `p >= 0.05` are explicitly\nexploratory and should not be interpreted as demonstrated predictive utility.\nThe proportion shown is `r sprintf("%.0f%%", 100 * selection_proportion)` of\nthe individuals within each trait and is a configurable tutorial rule rather\nthan an estimated optimal intensity. Rankings use cross-fitted OOF genomic\nvalues, not final breeding values from a model refitted to all phenotypes.\2',
              'section 10 prose', path, re.S)
          t = sub1(t,
              r'(selection_sizes_display <- selection_sizes \|>\n\s*left_join\(\n\s*selection_objectives \|>\n\s*select\(Trait, Selection_objective\),\n\s*by = "Trait"\n\s*\) \|>\n)(\s*mutate\()',
              r'\1  left_join(\n    model_selection |>\n      select(Trait, r, p_value, OOF_nominal_signal),\n    by = "Trait"\n  ) |>\n\2',
              'ranking summary join', path)
          t = sub1(t,
              r'(\s*Objective,\n)(\s*Selection_proportion,)',
              r'\1    r,\n    p_value,\n    OOF_nominal_signal,\n\2',
              'ranking summary fields', path)
          t = t.replace('caption = "Proportion and number of selected individuals by trait"',
                        'caption = "Exploratory candidate-ranking summary by positive-OOF trait"')
          t = sub1(t,
              r'Selection_objective, Genomic_value, Selection_score\n',
              'Selection_objective, Genomic_value, Selection_score,\n    OOF_r, OOF_nominal_p_value, OOF_nominal_signal\n',
              'preview fields', path)
          t = t.replace('caption = "Top five selected individuals by trait"',
                        'caption = "Top five candidates in each positive-OOF trait ranking"')
          t = sub1(t,
              r'Recurrence summarizes, across traits with positive OOF correlation, how many place each\nindividual among the most favorable 20%\. `N_traits`, selection frequency, and ranks are not combined\ninto a multi-trait index\.',
              'Recurrence summarizes, across traits with positive OOF correlation, how many\nplace each individual among the most favorable 20%. Recurrence that depends on\nweak positive OOF signals should remain exploratory. `N_traits`, selection\nfrequency, and ranks are not combined into a multi-trait index.',
              'recurrence prose', path)
          write(path, t)

          # ---------------- Module 05 PT ----------------
          path = 'analysis/05_results_pt.Rmd'
          t = Path(path).read_text(encoding='utf-8')
          t = t.replace('selection_eligible_traits', 'positive_oof_traits')
          t = t.replace('características elegíveis para seleção', 'características com correlação OOF positiva')
          t = t.replace('## 10. Seleção proporcional por característica',
                        '## 10. Ranking exploratório proporcional de candidatos por característica')
          t = sub1(t,
              r'(## 10\. Ranking exploratório proporcional de candidatos por característica\n\n).*?(\n\n```\{r proportional-selection-table\})',
              r'\1Os rankings de candidatos são apresentados para as características cujo método\nselecionado possui correlação OOF positiva. Os p-valores nominais são\ndescritivos e não determinam se um ranking é apresentado. Rankings com\n`p >= 0,05` são explicitamente exploratórios e não devem ser interpretados como\nutilidade preditiva demonstrada. A proporção apresentada é de\n`r sprintf("%.0f%%", 100 * selection_proportion)` dos indivíduos por\ncaracterística e constitui uma regra configurável do tutorial, e não uma\nintensidade ótima estimada. Os rankings utilizam valores genômicos OOF\ncross-fitted, e não valores genéticos finais de um modelo reajustado com todos\nos fenótipos.\2',
              'texto da seção 10', path, re.S)
          t = sub1(t,
              r'(selection_sizes_display <- selection_sizes \|>\n\s*left_join\(\n\s*selection_objectives \|>\n\s*select\(Trait, Selection_objective\),\n\s*by = "Trait"\n\s*\) \|>\n)(\s*mutate\()',
              r'\1  left_join(\n    model_selection |>\n      select(Trait, r, p_value, OOF_nominal_signal),\n    by = "Trait"\n  ) |>\n\2',
              'junção do resumo', path)
          t = sub1(t,
              r'(\s*Objetivo,\n)(\s*Selection_proportion,)',
              r'\1    r,\n    p_value,\n    OOF_nominal_signal,\n\2',
              'campos do resumo', path)
          t = t.replace('caption = "Proporção e número de indivíduos selecionados por característica"',
                        'caption = "Resumo exploratório do ranking de candidatos por característica com OOF positivo"')
          t = sub1(t,
              r'Selection_objective, Genomic_value, Selection_score\n',
              'Selection_objective, Genomic_value, Selection_score,\n    OOF_r, OOF_nominal_p_value, OOF_nominal_signal\n',
              'campos da prévia', path)
          t = t.replace('caption = "Cinco primeiros indivíduos selecionados por característica"',
                        'caption = "Cinco primeiros candidatos do ranking em cada característica com OOF positivo"')
          t = t.replace('Os primeiros indivíduos de cada ranking permitem visualizar diretamente a\nseleção produzida.',
                        'Os primeiros indivíduos de cada ranking mostram os candidatos priorizados pela\nregra exploratória.')
          t = sub1(t,
              r'A recorrência resume, entre as características com correlação OOF positiva, em quantas\ncada indivíduo aparece entre os 20% mais favoráveis\. `N_traits`, frequência de seleção e rankings não são\ncombinados em um índice multicaracterística\.',
              'A recorrência resume, entre as características com correlação OOF positiva, em\nquantas cada indivíduo aparece entre os 20% mais favoráveis. Recorrências que\ndependam de sinais OOF positivos fracos devem permanecer exploratórias.\n`N_traits`, frequência de seleção e rankings não são combinados em um índice\nmulticaracterística.',
              'texto da recorrência', path)
          write(path, t)

          # Guardrails on source content.
          paths = [
              'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd'
          ]
          all_text = '\n'.join(Path(p).read_text(encoding='utf-8') for p in paths)
          if 'selection_eligible_traits' in all_text:
              raise RuntimeError('Old eligibility variable remains')
          for token in ['positive_oof_traits', 'OOF_nominal_signal',
                        'positive_nominal_p_ge_0.05', 'OOF_nominal_p_value']:
              if token not in all_text:
                  raise RuntimeError(f'Missing expected token: {token}')
          if 'filter(Predictive_evidence == "positive_p_lt_0.05")' in all_text:
              raise RuntimeError('Old p-value selection gate remains')
          PY

      - name: Validate R syntax and staged diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('.audit-r'); out.mkdir(exist_ok=True)
          files = [
              'analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd'
          ]
          for f in files:
              chunks=[]; current=None
              for line in Path(f).read_text(encoding='utf-8').splitlines():
                  s=line.strip()
                  if current is None and s.startswith('```{r') and s.endswith('}'):
                      current=[]; continue
                  if current is not None and s == '```':
                      chunks.append(current); current=None; continue
                  if current is not None:
                      current.append(line)
              if current is not None:
                  raise RuntimeError(f'Unclosed R chunk: {f}')
              for i, code in enumerate(chunks, 1):
                  (out/f'{Path(f).stem}_{i:02d}.R').write_text('\n'.join(code)+'\n', encoding='utf-8')
              print(f'{f}: {len(chunks)} chunks')
          PY
          Rscript --vanilla -e '
            fs <- list.files(".audit-r", pattern="[.]R$", full.names=TRUE)
            stopifnot(length(fs) > 0)
            for (f in fs) parse(file=f)
            cat("Parsed", length(fs), "R chunks successfully.\n")
          '
          rm -rf .audit-r
          git add analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd
          git diff --cached --check

      - name: Commit validated sources and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refine-oof-ranking.yml .github/workflows/refine-oof-ranking-v2.yml .github/workflows/refine-oof-ranking-v3.yml
          git commit -m "Clarify exploratory OOF candidate rankings"
          git push origin HEAD:refine-oof-ranking-interpretation
