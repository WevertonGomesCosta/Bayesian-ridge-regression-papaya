name: Final Module 03 tutorial audit v2

on:
  push:
    branches:
      - final-m03-tutorial-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Module 03 PT and EN tutorial text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def executable_signature(text):
              chunks = []
              inside = False
              current = []
              for line in text.splitlines():
                  if re.match(r'^\s*```\{r(?:[\s,}]|$)', line):
                      inside = True; current = []; continue
                  if inside and re.match(r'^\s*```\s*$', line):
                      cleaned = []
                      for x in current:
                          if re.match(r'^\s*#', x):
                              continue
                          x = re.sub(r'\s+', '', x)
                          if x: cleaned.append(x)
                      chunks.append('\n'.join(cleaned)); inside = False; continue
                  if inside: current.append(line)
              return '\n---CHUNK---\n'.join(chunks)

          replacements = {
          'analysis/03_models_pt.Rmd': [
            ('---\n\n```{r setup, include=FALSE}', '---\n\nO chunk oculto a seguir define apenas opções de renderização compartilhadas pela página. Ele não ajusta modelos, não lê resultados e não executa cadeias MCMC.\n\n```{r setup, include=FALSE}'),
            ('## 2. Pacotes, entradas e diretórios de saída\n\n```{r packages}', '## 2. Pacotes, entradas e diretórios de saída\n\nO primeiro chunk carrega os pacotes usados no ajuste Bayesiano (`BGLR`), nos diagnósticos de cadeia (`coda`), na manipulação tabular e na construção da página. Nenhum modelo é ajustado nesta etapa.\n\n```{r packages}'),
            ('A estrutura recebida do módulo anterior pode ser visualizada diretamente.', 'A tabela seguinte funciona como ponto de controle entre os Módulos 02 e 03. Ela confirma que fenótipos, `X`, `M`, `G` e a tabela de folds possuem dimensões compatíveis antes de qualquer ajuste; nenhum objeto é filtrado ou reconstruído neste chunk.'),
            ('## 3. Modelo estatístico\n\nPara cada característica é considerado o modelo', '## 3. Modelo estatístico\n\nAs dez características são contínuas e são ajustadas com `response_type = "gaussian"`. Assim, a especificação abaixo descreve a média condicional usada pelo BGLR e um termo residual associado à resposta gaussiana. A mesma estrutura de intercepto e família é mantida para todos os métodos; o que muda é a representação probabilística do componente genômico.\n\nPara cada característica é considerado o modelo'),
            ('O BGLR ajusta um intercepto automaticamente. Por isso, a coluna de intercepto\ncriada no Módulo 02 é retirada de `X` antes da especificação do termo de\nfamília.\n\n```{r family-fixed-effect}', 'O BGLR ajusta um intercepto automaticamente. Por isso, a coluna de intercepto criada no Módulo 02 é retirada de `X` antes da especificação do termo de família. As colunas restantes representam os contrastes de `FAM` produzidos por `model.matrix()` no Módulo 02; não se cria aqui uma nova codificação de família.\n\nO chunk abaixo apenas remove a coluna redundante e mostra quais colunas de família entram no preditor.\n\n```{r family-fixed-effect}'),
            ('Os cinco folds definidos no Módulo 02 são utilizados sem reconstrução. Cada\nfold contém 30 indivíduos de validação e 120 de treinamento, mantendo a\nrepresentação das famílias.\n\n```{r cv-summary}', 'Os cinco folds definidos no Módulo 02 são utilizados sem reconstrução. Cada fold contém 30 indivíduos de validação e 120 de treinamento, mantendo a representação das famílias. A tabela abaixo apenas recupera essa partição já fixada; usar exatamente os mesmos folds para todos os métodos garante uma comparação pareada quanto aos indivíduos de validação.\n\n```{r cv-summary}'),
            ('A etapa seguinte organiza um resumo tabular dos objetos e resultados necessários para a interpretação desta seção.\n\n```{r mcmc-settings-table}', 'A tabela resume as escolhas que controlam a amostragem. Com 1.000.000 de iterações e `thin = 4`, o BGLR grava 250.000 amostras escalares; as primeiras 50.000 correspondem ao burn-in de 200.000 iterações, restando 200.000 amostras salvas para os diagnósticos posteriores. Esses números são derivados dos três parâmetros da cadeia.\n\n```{r mcmc-settings-table}'),
            ('## 6. Métodos de predição genômica\n\nA etapa seguinte organiza um resumo tabular dos objetos e resultados necessários para a interpretação desta seção.', '## 6. Métodos de predição genômica\n\nA tabela a seguir deve ser lida como um mapa entre o nome usado no tutorial, o componente correspondente no BGLR e a entrada genômica utilizada. Seis métodos operam diretamente sobre `M`; o GBLUP usa `G`. As subseções seguintes explicam o que muda na priori ou na representação do componente genômico.'),
            ('A etapa seguinte organiza um resumo tabular dos objetos e resultados necessários para a interpretação desta seção.\n\n```{r bl-lambda-table}', 'A tabela torna explícita a calibração que leva ao lambda fixo. `MSx` resume a escala quadrática de `M`, `R2 global` é o valor passado ao BGLR e `R2 do BL` é a parcela usada nesta calibração porque o preditor possui dois termos lineares. O valor final de `Lambda0` é então reutilizado sem ajuste específico por característica ou fold.\n\n```{r bl-lambda-table}'),
            ('### 6.7 GBLUP\n\nO GBLUP utiliza a matriz de relacionamento genômico `G`. No BGLR, a estrutura\né especificada pelo componente `RKHS` com `K = G`.', '### 6.7 GBLUP\n\nO GBLUP utiliza a matriz de relacionamento genômico `G`. No BGLR, essa estrutura é implementada pelo componente `RKHS` com `K = G`. Embora o componente se chame `RKHS`, neste caso o kernel fornecido é exatamente a matriz de relacionamento genômico; portanto, o termo representa os valores genômicos com covariância proporcional a `G`, conforme o modelo da Seção 3.2.'),
            ('## 7. Especificação dos modelos no BGLR\n\nO termo de família é comum aos sete métodos. Em seguida, cada modelo recebe o\ncomponente genômico correspondente.', '## 7. Especificação dos modelos no BGLR\n\nO termo de família é comum aos sete métodos. Em seguida, cada modelo recebe o componente genômico correspondente. Na lista `ETA_models`, `fixed` identifica o termo de família e `genomic` identifica o termo que diferencia os métodos. `X = M` é usado nas regressões por marcadores; `K = G` é usado no GBLUP. Somente BayesB2 e BL recebem argumentos adicionais porque suas parametrizações foram explicitamente fixadas nas seções anteriores.'),
            ('## 8. Combinações de característica, fold e método\n\nAs mesmas sete especificações são aplicadas às dez características e aos cinco\nfolds. Uma semente determinística é atribuída a cada combinação.', '## 8. Combinações de característica, fold e método\n\nAs mesmas sete especificações são aplicadas às dez características e aos cinco folds. O produto cartesiano gera 350 linhas: 50 ajustes por método, correspondentes a dez características em cinco folds. Depois de ordenar as combinações de forma estável, cada linha recebe um número sequencial, uma semente exclusiva e um `Run_id` legível. A semente controla apenas a reprodução da cadeia daquela combinação; ela não modifica os folds.'),
            ('O bloco abaixo percorre as combinações de característica, fold e método. Os\ncomentários no código destacam as etapas principais do ajuste.\n\nAntes do laço, são definidos os arquivos que contêm as cadeias escalares\nutilizadas posteriormente nos diagnósticos MCMC.', 'O bloco abaixo percorre as combinações de característica, fold e método. Antes do laço, o tutorial mapeia quais arquivos escalares nativos do BGLR serão usados nos diagnósticos. `genomic_trace_suffix` identifica o arquivo, `genomic_trace_header` informa se ele possui cabeçalho, `genomic_trace_column` seleciona a coluna escalar e `genomic_trace_parameter` fornece o rótulo apresentado posteriormente.\n\nA cadeia escolhida é uma quantidade escalar representativa de cada especificação, não um diagnóstico exaustivo de todos os efeitos de marcador. No BL, como lambda é fixo e não possui cadeia atualizada, o segundo diagnóstico usa `mu.dat` e é rotulado como intercepto; portanto, ele não deve ser interpretado como uma cadeia do componente genômico.'),
            ('A etapa seguinte executa o procedimento de ajuste definido para os métodos, características e folds do desenho analítico.\n\n```{r fit-models, eval=FALSE}', 'O chunk `fit-models` contém o procedimento completo de reprodução dos 350 ajustes, mas permanece com `eval=FALSE` na página. Isso evita que uma renderização rotineira do tutorial reinicie as cadeias MCMC e sobrescreva seus arquivos. Para uma reprodução integral a partir do zero, este é o bloco que deve ser executado deliberadamente depois que os Módulos 01 e 02 tiverem produzido seus objetos.\n\nEm cada execução, o código mascara somente os 30 fenótipos do fold corrente, chama `BGLR()` com a especificação correspondente, registra tempo e avisos, recupera as predições dos indivíduos mascarados e decompõe `yHat` em intercepto, efeito fixo de família e componente genômico. Os arquivos escalares gravados pelo BGLR incluem amostras salvas durante o burn-in; por isso o código remove explicitamente as primeiras `BURN_IN_SAVED_SAMPLES` linhas antes de calcular ESS e Geweke.\n\n```{r fit-models, eval=FALSE}'),
            ('As tabelas produzidas pelo ajuste são lidas de `output/models/` para os\ndiagnósticos e resumos apresentados a seguir.', 'Como os chunks de ajuste permanecem desativados durante a renderização, as tabelas produzidas previamente pelo procedimento completo são lidas de `output/models/`. Assim, esta parte da página pode ser reconstruída para inspeção e apresentação sem executar novamente as 350 cadeias.'),
            ('Algumas linhas das predições OOF permitem verificar diretamente a estrutura da\nsaída.', 'A tabela de predições contém somente os indivíduos do fold que estava mascarado em cada ajuste, de modo que cada linha é uma predição OOF. Já `genomic_values_by_fold` armazena o componente genômico calculado para todos os 150 indivíduos em cada ajuste; nos módulos seguintes, o contexto do fold deve ser respeitado ao construir valores cross-fitted.\n\nAlgumas linhas das predições OOF permitem verificar diretamente a decomposição entre valor observado, predição total, componente fixo de família e componente genômico.'),
            ('As métricas calculadas em cada fold incluem correlação, RMSE, MAE, viés,\ninclinação de calibração, DIC e número efetivo de parâmetros.', 'As métricas preditivas são calculadas somente nos 30 indivíduos mascarados do fold. `Correlation` é a correlação de Pearson entre observado e predito; RMSE e MAE resumem a magnitude do erro nas unidades da característica; `Prediction_bias = mean(Predicted - Observed)` tem valor ideal 0; e `Regression_slope = cov(Observed, Predicted) / var(Predicted)` é a inclinação da regressão de observado sobre predito, com referência ideal 1.\n\nDIC e `Effective_parameters` (`pD`) têm natureza diferente: são critérios derivados do ajuste Bayesiano aos fenótipos observados de treinamento, não métricas OOF. Valores menores de DIC indicam melhor compromisso ajuste–complexidade apenas entre modelos ajustados à mesma resposta e conjunto comparável; DIC não deve ser comparado diretamente entre características em escalas distintas.'),
            ('A quantidade de resultados produzidos também pode ser conferida diretamente.', 'A tabela seguinte é uma checagem estrutural do laço. Esperam-se 350 linhas de métricas, 10.500 predições OOF (350 ajustes × 30 indivíduos), 52.500 valores genômicos por fold (350 × 150) e 700 cadeias escalares avaliadas (duas por ajuste). Divergências nesses totais indicariam uma execução incompleta ou uma consolidação inconsistente.'),
            ('Para cada ajuste são examinadas a cadeia da variância residual e uma cadeia\nescalar representativa do modelo. No BL, como \\(\\lambda\\) é fixo, o segundo\ndiagnóstico utiliza a cadeia do intercepto.\n\nO tamanho efetivo da amostra (ESS) e a estatística de Geweke são utilizados\ncomo indicadores de inspeção da cadeia. Valores de ESS inferiores a 1.000 ou\n\\(|Z_{Geweke}|>2\\) são destacados para revisão, sem constituir uma regra\nautomática de exclusão do modelo.', 'Para cada ajuste são examinadas a cadeia da variância residual e uma cadeia escalar representativa da especificação. No BL, como \\(\\lambda\\) é fixo, o segundo diagnóstico utiliza a cadeia do intercepto. Portanto, esta seção avalia 700 cadeias escalares, mas não pretende demonstrar convergência individual de todos os coeficientes de marcador ou demais quantidades latentes.\n\nO tamanho efetivo da amostra (ESS) resume a quantidade de informação aproximadamente independente após considerar autocorrelação; valores maiores são preferíveis. A estatística de Geweke contrasta médias de partes inicial e final da cadeia pós-burn-in; valores próximos de zero são mais compatíveis com estabilidade. `ESS < 1000` e \\(|Z_{Geweke}|>2\\) são apenas limiares de triagem para inspeção, não testes formais de validade do modelo nem critérios automáticos de exclusão. Diagnósticos gráficos e o contexto da cadeia continuam necessários quando houver sinalização.'),
            ('As cadeias destacadas podem ser examinadas diretamente na tabela abaixo.', 'A tabela abaixo lista somente as cadeias que ultrapassam pelo menos um dos limiares de triagem. Uma linha sinalizada identifica a combinação característica–fold–método e o parâmetro que merece inspeção; ela não implica, isoladamente, que todas as predições daquele ajuste sejam inválidas.'),
            ('Após os diagnósticos, a tabela de convergência é atualizada com os indicadores\nde revisão, o resumo por método é gravado e o objeto final é reunido para uso\nnos módulos seguintes.\n\n```{r save-results, eval=FALSE}', 'Após os diagnósticos, a tabela de convergência é atualizada com os indicadores de revisão, o resumo por método é gravado e o objeto final é reunido para uso nos módulos seguintes. Assim como o ajuste, este chunk permanece com `eval=FALSE` na renderização: ele deve ser executado quando as tabelas primárias forem regeneradas, para atualizar `models_object.rds` de forma coerente com aquelas saídas.\n\n```{r save-results, eval=FALSE}'),
          ],
          'analysis/03_models_en.Rmd': [
            ('---\n\n```{r setup, include=FALSE}', '---\n\nThe hidden chunk below defines only page-wide rendering options. It does not fit models, read results, or run MCMC chains.\n\n```{r setup, include=FALSE}'),
            ('## 2. Packages, inputs, and output directories\n\n```{r packages}', '## 2. Packages, inputs, and output directories\n\nThe first chunk loads the packages used for Bayesian fitting (`BGLR`), chain diagnostics (`coda`), tabular manipulation, and page construction. No model is fitted at this stage.\n\n```{r packages}'),
            ('The structure received from the previous module can be inspected directly.', 'The following table acts as a checkpoint between Modules 02 and 03. It confirms that phenotypes, `X`, `M`, `G`, and the fold table have compatible dimensions before any fit; no object is filtered or reconstructed in this chunk.'),
            ('## 3. Statistical model\n\nFor each trait, the common model is', '## 3. Statistical model\n\nThe ten traits are continuous and are fitted with `response_type = "gaussian"`. The specification below therefore describes the conditional mean used by BGLR together with a residual term for the Gaussian response. The same intercept and family structure is retained across methods; what changes is the probabilistic representation of the genomic component.\n\nFor each trait, the common model is'),
            ('BGLR fits an intercept automatically. Therefore, the intercept column created\nin Module 02 is removed from `X` before the family term is specified.\n\n```{r family-fixed-effect}', 'BGLR fits an intercept automatically. Therefore, the intercept column created in Module 02 is removed from `X` before the family term is specified. The remaining columns are the `FAM` contrasts produced by `model.matrix()` in Module 02; no new family coding is created here.\n\nThe chunk below only removes the redundant column and displays the family columns that enter the predictor.\n\n```{r family-fixed-effect}'),
            ('The five folds defined in Module 02 are used without reconstruction. Each fold\ncontains 30 validation individuals and 120 training individuals while\npreserving family representation.\n\n```{r cv-summary}', 'The five folds defined in Module 02 are used without reconstruction. Each fold contains 30 validation individuals and 120 training individuals while preserving family representation. The table below only retrieves this fixed partition; using exactly the same folds for every method makes comparisons paired with respect to validation individuals.\n\n```{r cv-summary}'),
            ('The next step organizes a tabular summary of the objects and results needed to interpret this section.\n\n```{r mcmc-settings-table}', 'The table summarizes the choices controlling MCMC sampling. With 1,000,000 iterations and `thin = 4`, BGLR writes 250,000 scalar draws; the first 50,000 correspond to the 200,000-iteration burn-in, leaving 200,000 saved draws for the downstream diagnostics. These counts are derived from the three chain parameters.\n\n```{r mcmc-settings-table}'),
            ('## 6. Genomic prediction methods\n\nThe next step organizes a tabular summary of the objects and results needed to interpret this section.', '## 6. Genomic prediction methods\n\nThe following table is a map between the name used in the tutorial, the corresponding BGLR component, and the genomic input supplied to the fit. Six methods operate directly on `M`; GBLUP uses `G`. The subsections that follow explain how the prior or genomic representation changes across methods.'),
            ('The next step organizes a tabular summary of the objects and results needed to interpret this section.\n\n```{r bl-lambda-table}', 'The table makes explicit the calibration leading to the fixed lambda. `MSx` summarizes the quadratic scale of `M`, `Global R2` is the value passed to BGLR, and `BL R2` is the share used in this calibration because the predictor contains two linear terms. The resulting `Lambda0` is then reused without trait- or fold-specific tuning.\n\n```{r bl-lambda-table}'),
            ('### 6.7 GBLUP\n\nGBLUP uses the genomic relationship matrix `G`. In BGLR, this structure is\nspecified through an `RKHS` component with `K = G`.', '### 6.7 GBLUP\n\nGBLUP uses the genomic relationship matrix `G`. In BGLR, this structure is implemented through an `RKHS` component with `K = G`. Although the component is named `RKHS`, the supplied kernel here is exactly the genomic relationship matrix, so the term represents genomic values with covariance proportional to `G`, consistent with the model in Section 3.2.'),
            ('## 7. BGLR model specifications\n\nThe family term is common to all seven methods. Each model then receives its\ncorresponding genomic component.', '## 7. BGLR model specifications\n\nThe family term is common to all seven methods. Each model then receives its corresponding genomic component. In `ETA_models`, `fixed` identifies the family term and `genomic` identifies the term that differentiates methods. `X = M` is used for marker regressions, whereas `K = G` is used for GBLUP. Only BayesB2 and BL receive additional arguments because their parameterizations were explicitly fixed in the preceding sections.'),
            ('## 8. Trait, fold, and method combinations\n\nThe same seven specifications are applied to all ten traits and five folds. A\ndeterministic seed is assigned to each combination.', '## 8. Trait, fold, and method combinations\n\nThe same seven specifications are applied to all ten traits and five folds. Their Cartesian product creates 350 rows: 50 fits per method, corresponding to ten traits across five folds. After the combinations are placed in a stable order, every row receives a sequential run number, a unique seed, and a readable `Run_id`. The seed controls reproducibility of that chain only; it does not alter the folds.'),
            ('The block below iterates over the trait, fold, and method combinations. Short\ncomments highlight the main steps of each fit.\n\nBefore the loop, the native files containing the scalar chains used in the\nMCMC diagnostics are identified.', 'The block below iterates over the trait, fold, and method combinations. Before the loop, the tutorial maps the native BGLR scalar files used for diagnostics. `genomic_trace_suffix` identifies the file, `genomic_trace_header` states whether it has a header, `genomic_trace_column` selects the scalar column, and `genomic_trace_parameter` supplies the label shown downstream.\n\nThe selected chain is one representative scalar quantity for each specification, not an exhaustive diagnostic of every marker effect. For BL, lambda is fixed and has no updated chain, so the second diagnostic uses `mu.dat` and is labelled as the intercept; it must not be interpreted as a genomic-component chain.'),
            ('The next step executes the fitting procedure defined for the methods, traits, and folds in the analytical design.\n\n```{r fit-models, eval=FALSE}', 'The `fit-models` chunk contains the complete procedure for reproducing all 350 fits, but remains `eval=FALSE` in the page. This prevents routine tutorial rendering from restarting the MCMC chains and overwriting their files. For a full reproduction from scratch, this is the block that must be run deliberately after Modules 01 and 02 have produced their objects.\n\nFor each run, the code masks only the 30 phenotypes in the current fold, calls `BGLR()` with the corresponding specification, records elapsed time and warnings, recovers predictions for the masked individuals, and decomposes `yHat` into intercept, fixed family effect, and genomic component. The scalar files written by BGLR include saved draws from burn-in iterations, so the code explicitly removes the first `BURN_IN_SAVED_SAMPLES` rows before computing ESS and Geweke diagnostics.\n\n```{r fit-models, eval=FALSE}'),
            ('The tables produced by model fitting are read from `output/models/` for the\ndiagnostics and summaries presented below.', 'Because the fitting chunks remain disabled during rendering, tables previously produced by the complete fitting procedure are read from `output/models/`. This allows the inspection and presentation sections of the page to be rebuilt without running all 350 chains again.'),
            ('A subset of the OOF predictions allows the output structure to be inspected\ndirectly.', 'The prediction table contains only individuals from the fold that was masked in each fit, so every row is an OOF prediction. In contrast, `genomic_values_by_fold` stores the genomic component calculated for all 150 individuals in every fit; downstream modules must respect fold context when constructing cross-fitted values.\n\nA subset of the OOF predictions directly shows the decomposition into observed value, total prediction, fixed family component, and genomic component.'),
            ('Fold-level metrics include correlation, RMSE, MAE, bias, calibration slope,\nDIC, and the effective number of parameters.', 'Predictive metrics are computed only for the 30 masked individuals in each fold. `Correlation` is the Pearson correlation between observed and predicted values; RMSE and MAE summarize error magnitude in trait units; `Prediction_bias = mean(Predicted - Observed)` has ideal value 0; and `Regression_slope = cov(Observed, Predicted) / var(Predicted)` is the slope from regressing observed on predicted values, with reference value 1.\n\nDIC and `Effective_parameters` (`pD`) have a different role: they are posterior fit-complexity criteria derived from the observed training phenotypes, not OOF predictive metrics. Lower DIC indicates a better fit-complexity tradeoff only among models fitted to the same response and comparable data; DIC should not be directly compared across traits on different scales.'),
            ('The number of results produced can also be inspected directly.', 'The following table is a structural check of the loop. Expected totals are 350 metric rows, 10,500 OOF predictions (350 fits × 30 individuals), 52,500 fold-specific genomic values (350 × 150), and 700 scalar chains reviewed (two per fit). Different totals would indicate an incomplete execution or inconsistent consolidation.'),
            ('For every fit, the residual-variance chain and one scalar chain representative\nof the model are examined. For BL, because \\(\\lambda\\) is fixed, the second\ndiagnostic uses the intercept chain.\n\nEffective sample size (ESS) and the Geweke statistic are used as chain\ninspection indicators. ESS values below 1,000 or \\(|Z_{Geweke}|>2\\) are\nhighlighted for review but are not automatic model-exclusion rules.', 'For every fit, the residual-variance chain and one scalar chain representative of the specification are examined. For BL, because \\(\\lambda\\) is fixed, the intercept chain is used as the second diagnostic. This section therefore evaluates 700 scalar chains but does not claim to establish convergence of every marker coefficient or other latent quantity individually.\n\nEffective sample size (ESS) summarizes the amount of approximately independent information after accounting for autocorrelation; larger values are preferable. The Geweke statistic contrasts means from early and late parts of the post-burn-in chain; values near zero are more compatible with stability. `ESS < 1000` and \\(|Z_{Geweke}|>2\\) are screening thresholds for inspection only, not formal tests of model validity or automatic exclusion criteria. Graphical diagnostics and chain context remain necessary when a flag is raised.'),
            ('The chains highlighted by these diagnostics can be inspected directly below.', 'The table below lists only chains that cross at least one screening threshold. A flagged row identifies the trait–fold–method combination and parameter that deserves inspection; by itself, it does not imply that all predictions from that fit are invalid.'),
            ('After the diagnostics, the convergence table is updated with the review\nindicators, the method-level summary is written, and the final object is\nassembled for use by the following modules.\n\n```{r save-results, eval=FALSE}', 'After the diagnostics, the convergence table is updated with review flags, the method-level summary is saved, and the final object is assembled for downstream modules. Like model fitting, this chunk remains `eval=FALSE` during rendering: it should be run when the primary tables are regenerated so that `models_object.rds` is updated consistently with those outputs.\n\n```{r save-results, eval=FALSE}'),
          ]}

          for path_str, reps in replacements.items():
              path = Path(path_str)
              original = path.read_text(encoding='utf-8')
              sig = executable_signature(original)
              text = original
              for old, new in reps:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_str}: expected one match, found {count}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              if executable_signature(text) != sig:
                  raise SystemExit(f'{path_str}: executable R code changed')
              path.write_text(text, encoding='utf-8')
          print('PASS: Module 03 tutorial prose refined; executable R code unchanged.')
          PY
          git diff --check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Parse Module 03 chunks and inline R
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/03_models_pt.Rmd', 'analysis/03_models_en.Rmd')
          n_chunks <- 0L; n_inline <- 0L
          for (f in files) {
            x <- readLines(f, warn = FALSE, encoding = 'UTF-8')
            inside <- FALSE; prose <- character()
            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl = TRUE)) { inside <- TRUE; next }
              if (inside && grepl('^\\s*```\\s*$', line, perl = TRUE)) { inside <- FALSE; next }
              if (!inside) prose <- c(prose, line)
            }
            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl = TRUE)))
            if (length(inline)) for (expr in inline) {
              code <- sub('^`r ', '', expr); code <- sub('`$', '', code); parse(text = code); n_inline <- n_inline + 1L
            }
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl = TRUE)
            for (s in starts) {
              rel <- which(grepl('^\\s*```\\s*$', x[(s + 1L):length(x)], perl = TRUE))[1]
              if (is.na(rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + rel
              code <- if (e > s + 1L) x[(s + 1L):(e - 1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text = code); n_chunks <- n_chunks + 1L
            }
          }
          cat('Parsed Module 03 R chunks:', n_chunks, '\n')
          cat('Parsed Module 03 inline R expressions:', n_inline, '\n')
          RS

      - name: Commit only Module 03 source files
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' analysis/03_models_en.Rmd analysis/03_models_pt.Rmd | sort)"
          test "$changed" = "$expected"
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/03_models_pt.Rmd analysis/03_models_en.Rmd
          git commit -m "Refine Module 03 tutorial guidance"
          git push origin HEAD:final-m03-tutorial-audit
