name: Apply parameter documentation audit

on:
  push:
    branches:
      - parameter-documentation-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add parameter explanations and semantic comments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path(f'analysis/{m}_{lang}.Rmd') for m in ['01_preprocessing','02_matrices','03_models','04_results','05_results'] for lang in ['pt','en']]

          def executable_signature(text):
              lines=text.splitlines(); out=[]; inside=False
              for line in lines:
                  if re.match(r'^\s*```\{r(?:[\s,}]|$)', line):
                      inside=True; continue
                  if inside and re.match(r'^\s*```\s*$', line):
                      inside=False; continue
                  if inside:
                      s=line.lstrip()
                      if not s or s.startswith('#'):
                          continue
                      out.append(line.rstrip())
              return '\n'.join(out)

          before={p: executable_signature(p.read_text(encoding='utf-8')) for p in files}

          replacements = {
          Path('analysis/01_preprocessing_pt.Rmd'): [
          ('''A etapa seguinte define os caminhos dos arquivos usados como entradas e saídas do módulo.''', '''A etapa seguinte define os caminhos dos arquivos usados como entradas e saídas do módulo. Esses caminhos apenas organizam a leitura e a persistência dos resultados e não constituem parâmetros estatísticos.

Dois parâmetros de controle são fixados neste ponto. `CALL_RATE_MIN = 0.90` exige que pelo menos 90% das chamadas de um loco estejam disponíveis; em conjunto com a exigência de pelo menos duas classes genotípicas, esse limite evita manter locos com informação insuficiente. `PHENOTYPE_DISTANCE_THRESHOLD = 4` identifica, apenas para inspeção, observações a pelo menos quatro desvios-padrão da média da característica. Essa regra é diagnóstica: nenhum fenótipo é removido, winsorizado ou alterado por esse limite.'''),
          ('''```{r caminhos}
GENOTYPE_FILE <- here("data", "papaya_ssr_genotypes.xlsx")
PHENOTYPE_FILE <- here("data", "papaya_phenotypes_2024_2025.xlsx")
OUTPUT_DIR <- here("output", "preprocessing")

CALL_RATE_MIN <- 0.90
PHENOTYPE_DISTANCE_THRESHOLD <- 4''', '''```{r caminhos}
# Define os dois arquivos de entrada e a pasta em que o pré-processamento será salvo.
GENOTYPE_FILE <- here("data", "papaya_ssr_genotypes.xlsx")
PHENOTYPE_FILE <- here("data", "papaya_phenotypes_2024_2025.xlsx")
OUTPUT_DIR <- here("output", "preprocessing")

# Exige pelo menos 90% de chamadas disponíveis para manter um loco SSR.
CALL_RATE_MIN <- 0.90
# Usa quatro desvios-padrão somente como limiar de sinalização diagnóstica.
PHENOTYPE_DISTANCE_THRESHOLD <- 4'''),
          ('''  geom_histogram(bins = 20) +''', '''  # Usa 20 classes apenas para padronizar a resolução visual dos histogramas.
  geom_histogram(bins = 20) +'''),
          ],
          Path('analysis/01_preprocessing_en.Rmd'): [
          ('''The next step defines the file paths used as inputs and outputs in this module.''', '''The next step defines the file paths used as inputs and outputs in this module. These paths only organize data reading and result persistence and are not statistical parameters.

