name: Finalize semantic chunk documentation v2

on:
  push:
    branches:
      - chunk-documentation-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated contextual transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/finalize-chunk-documentation.yml').read_text(encoding='utf-8').splitlines()
          scripts = []
          collecting = False
          current = []
          for line in source:
              stripped = line.strip()
              if stripped == "python - <<'PY'":
                  collecting = True
                  current = []
                  continue
              if collecting and stripped == 'PY':
                  scripts.append('\n'.join(current) + '\n')
                  collecting = False
                  continue
              if collecting:
                  current.append(line[10:] if line.startswith('          ') else line)
          if not scripts:
              raise RuntimeError('Context-specific transformation script not found')
          subprocess.run(['python', '-c', scripts[0]], check=True)
          PY

      - name: Explain support-table joins explicitly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = {
              Path('analysis/04_results_pt.Rmd'): {
                  '    by = c("Trait", "Selected_method" = "Method")':
                      '    # Associa o método selecionado à tabela de suporte para anexar os indicadores usados na decisão.\n'
                      '    by = c("Trait", "Selected_method" = "Method")',
                  '    by = c("Trait", "Selected_method")':
                      '    # Junta o desempenho do método escolhido usando característica e método como chaves.\n'
                      '    by = c("Trait", "Selected_method")',
              },
              Path('analysis/04_results_en.Rmd'): {
                  '    by = c("Trait", "Selected_method" = "Method")':
                      '    # Match the selected method to the support table to append the indicators used in the decision.\n'
                      '    by = c("Trait", "Selected_method" = "Method")',
                  '    by = c("Trait", "Selected_method")':
                      '    # Join selected-method performance using trait and method as keys.\n'
                      '    by = c("Trait", "Selected_method")',
              },
          }

          for path, replacements in pairs.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Audit documentation coverage and weak patterns
        shell: bash
        run: |
          if grep -R -n -E 'Define o caminho ou local associado a `oof_direction_summary`|Define the path or location associated with `oof_direction_summary`|Constrói `method_labels` com a informação necessária|Build `method_labels` with the information required|Constrói `correlation_plot` com a informação necessária|Build `correlation_plot` with the information required|Executa o bloco de cálculo correspondente|Execute the calculation block corresponding|Continua a transformação desta etapa|Continue the current transformation step' analysis/0*.Rmd; then
            echo 'Known weak annotations remain.'
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import math, re
          CHUNK_RE = re.compile(r'^\s*```\{r(?:[\s,}]|$)')
          END_RE = re.compile(r'^\s*```\s*$')
          HEADING_RE = re.compile(r'^\s*#{1,6}\s+')
          WORD_RE = re.compile(r'[A-Za-zÀ-ÖØ-öø-ÿ]{2,}')
          failures=[]; total=large=0
          for path in sorted(Path('analysis').glob('*.Rmd')):
              lines=path.read_text(encoding='utf-8').splitlines(); i=0; prev=-1
              while i < len(lines):
                  if not CHUNK_RE.match(lines[i]): i+=1; continue
                  s=i; j=i+1
                  while j<len(lines) and not END_RE.match(lines[j]): j+=1
                  total+=1
                  prose=any(len(WORD_RE.findall(x.strip()))>=5 and not HEADING_RE.match(x.strip()) and not x.strip().startswith(('```','<!--','-->','<div','</div','$$','\\[','\\]','---','|',':--')) for x in lines[prev+1:s] if x.strip())
                  if not prose: failures.append(f'{path}:{s+1}: missing explanatory prose')
                  body=lines[s+1:j]; code_n=sum(1 for x in body if x.strip() and not x.lstrip().startswith('#'))
                  if code_n>=15:
                      large+=1; comments=sum(1 for x in body if x.lstrip().startswith('#') and not x.lstrip().startswith('#|')); req=max(2,math.ceil(code_n/15))
                      if comments<req: failures.append(f'{path}:{s+1}: comments={comments}/{req}')
                  prev=j; i=j+1
          print(f'Audited chunks: {total}; large chunks: {large}')
          if failures: raise SystemExit('\n'.join(failures))
          print('PASS: every chunk has explanatory prose and every large chunk has sufficient semantic comments.')
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse all chunks and commit final source
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- list.files('analysis', pattern='\\.Rmd$', full.names=TRUE)
          n <- 0L
          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + e_rel
              code <- if (e>s+1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code); n <- n+1L
            }
          }
          stopifnot(n==217L)
          cat('Parsed R chunks:', n, '\n')
          RS

          git diff --check
          rm -f .github/workflows/finalize-chunk-documentation.yml
          rm -f .github/workflows/finalize-chunk-documentation-v2.yml

          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed={f'analysis/{m}_{lang}.Rmd' for m in ['01_preprocessing','02_matrices','03_models','04_results','05_results'] for lang in ['en','pt']}
          allowed.update({'.github/workflows/finalize-chunk-documentation.yml','.github/workflows/finalize-chunk-documentation-v2.yml'})
          bad=[p for p in changed if p not in allowed]
          if bad: raise SystemExit('Unexpected files:\n'+'\n'.join(bad))
          source=[p for p in changed if p.startswith('analysis/')]
          if len(source)!=10: raise SystemExit(f'Expected 10 source files, found {len(source)}')
          print('Validated source files:', len(source))
          PY

          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add -A
          git commit -m "Finalize semantic chunk documentation"
          git push origin HEAD:chunk-documentation-audit
