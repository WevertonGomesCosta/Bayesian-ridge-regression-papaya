name: Finalize content-only cleanup M01 M02

on:
  push:
    branches:
      - didactic-content-cleanup-m01-m02

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Finalize content-only cleanup M01 M02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-content-cleanup-m01-m02
          fetch-depth: 0
      - name: Remove remaining project-meta wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'analysis/01_preprocessing_pt.Rmd': [
                  ('Não é aplicado um limiar de exclusão de indivíduos neste tutorial; todos os 150 indivíduos alinhados são preservados para as etapas seguintes.',
                   'Nenhum limiar de exclusão por completude é aplicado aos indivíduos; todos os 150 indivíduos alinhados são preservados para as etapas seguintes.'),
              ],
              'analysis/01_preprocessing_en.Rmd': [
                  ('No individual-exclusion threshold is applied in this tutorial; all 150 aligned individuals are preserved for subsequent stages.',
                   'No individual-exclusion threshold based on completeness is applied; all 150 aligned individuals are preserved for subsequent stages.'),
              ],
              'analysis/02_matrices_pt.Rmd': [
                  ('# Formata a tabela para exibição no tutorial.', '# Exibe o inventário numérico das matrizes.'),
              ],
              'analysis/02_matrices_en.Rmd': [
                  ("# Build the design matrix for the analysis's only categorical fixed effect.", '# Build the design matrix for the only categorical fixed effect used in the analysis.'),
                  ('# Format the table for display in the tutorial.', '# Display the numerical inventory of the matrices.'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  n = text.count(old)
                  if n != 1:
                      raise SystemExit(f'{name}: expected one occurrence, found {n}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          echo '=== residual meta terms ==='
          grep -niE 'tutorial|consistent presentation|apresentação consistente|helper changes presentation|função altera somente a apresentação|paths defined below organize|caminhos definidos a seguir organizam|the reader|o leitor|hidden chunk|chunk oculto|first chunk|primeiro chunk|suppressPackageStartupMessages' \
            analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd \
            analysis/02_matrices_pt.Rmd analysis/02_matrices_en.Rmd || true
      - name: Commit final source cleanup
        shell: bash
        run: |
          changed=$(git diff --name-only)
          expected=$'analysis/01_preprocessing_en.Rmd\nanalysis/01_preprocessing_pt.Rmd\nanalysis/02_matrices_en.Rmd\nanalysis/02_matrices_pt.Rmd'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "Weverton Gomes da Costa"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd \
                  analysis/02_matrices_pt.Rmd analysis/02_matrices_en.Rmd
          git commit -m "Finalize content-only wording in Modules 01 and 02"
          git push origin HEAD:didactic-content-cleanup-m01-m02
