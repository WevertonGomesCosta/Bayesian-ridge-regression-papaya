name: Validate scientific audit

on:
  push:
    branches:
      - scientific-product-audit

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scientific-product-audit
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - name: Extract and parse R chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'analysis/02_matrices_en.Rmd', 'analysis/02_matrices_pt.Rmd',
              'analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd',
              'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd',
          ]
          out = Path('.audit-r')
          out.mkdir(exist_ok=True)
          pattern = re.compile(r'^```\{r[^\n]*\}\s*\n(.*?)^```\s*$', re.M | re.S)
          for f in files:
              text = Path(f).read_text(encoding='utf-8')
              chunks = pattern.findall(text)
              if not chunks:
                  raise RuntimeError(f'No R chunks found in {f}')
              target = out / (Path(f).stem + '.R')
              target.write_text('\n\n'.join(chunks), encoding='utf-8')
              print(f'{f}: {len(chunks)} R chunks')
          PY
          for f in .audit-r/*.R; do
            echo "Parsing $f"
            Rscript -e "parse(file='$f'); cat('OK\n')"
          done
      - name: Check tutorial invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sources = '\n'.join(
              Path(p).read_text(encoding='utf-8') for p in [
                  'analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd',
                  'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
                  'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd',
              ]
          )
          forbidden = [
              'positive_p_lt_0.05', 'positive_p_ge_0.05',
              'nonpositive_p_ge_0.05', 'automatic_supported',
              'rrblup_preferred_among_equivalent_models',
              'best_non_rrblup_equivalent_model',
              'showed numerical instability', 'apresentar instabilidade numérica'
          ]
          bad = [x for x in forbidden if x in sources]
          if bad:
              raise RuntimeError(f'Forbidden source residues: {bad}')

          for path in ['analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              for chunk in ['fit-models', 'assemble-fit-results', 'save-results']:
                  token = f'```{{r {chunk}, eval=FALSE}}'
                  if token not in text:
                      raise RuntimeError(f'{path}: missing protected chunk {token}')

          for path in ['analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              required = [
                  'OOF_predictive_direction',
                  'filter(OOF_predictive_direction == "positive")',
                  'selection_eligible_traits',
                  'DIC_COMPETITIVE_THRESHOLD',
                  'Operational_competitive_set_rule'
              ]
              missing = [x for x in required if x not in text]
              if missing:
                  raise RuntimeError(f'{path}: missing audited constructs {missing}')

          for path in ['analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              if 'm04$selection_eligible_traits' not in text:
                  raise RuntimeError(f'{path}: M04/M05 interface is not aligned')

          print('All scientific-audit invariants passed.')
          PY
          git diff --check main...HEAD
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm -rf .audit-r
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-scientific-audit.yml
          git commit -m "Complete scientific source validation"
          git push origin HEAD:scientific-product-audit
