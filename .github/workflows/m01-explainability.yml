name: Refine Module 01 stepwise explainability

on:
  push:
    branches:
      - didactic-explainability-m01

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Run Module 01 explainability helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: didactic-explainability-m01
          fetch-depth: 0

      - name: Apply stepwise explanations
        run: python .github/m01_explainability.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only)
          expected=$'analysis/01_preprocessing_en.Rmd\nanalysis/01_preprocessing_pt.Rmd'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "Weverton Gomes da Costa"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd
          git commit -m "Improve stepwise explanations in Module 01"
          git push origin HEAD:didactic-explainability-m01
