name: Final transversal audit cleanup

on:
  push:
    branches:
      - final-transversal-audit
    paths:
      - '.github/workflows/final-transversal-audit.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final transversal cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'DESCRIPTION': [
                  ('Version: 1.0.0', 'Version: 1.0.1'),
              ],
              'CITATION.cff': [
                  ('version: 1.0.0', 'version: 1.0.1'),
                  ('date-released: 2026-08-24', 'date-released: 2026-08-25'),
              ],
              'analysis/04_results_en.Rmd': [
                  ('# Summarize the dimensions and categories of the preprocessing object received by the module.',
                   '# Summarize the coverage of the model-fitting results received from Module 03.'),
              ],
              'analysis/05_results_en.Rmd': [
                  ('# Summarize the dimensions and categories of the preprocessing object received by the module.',
                   '# Summarize the coverage of the consolidated results presented in this module.'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' CITATION.cff DESCRIPTION analysis/04_results_en.Rmd analysis/05_results_en.Rmd | sort)"
          test "$changed" = "$expected"

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add CITATION.cff DESCRIPTION analysis/04_results_en.Rmd analysis/05_results_en.Rmd
          git commit -m "Finalize tutorial metadata and comments"
          git push origin HEAD:final-transversal-audit
