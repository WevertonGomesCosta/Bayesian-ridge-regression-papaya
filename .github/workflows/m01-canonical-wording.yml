name: Normalize Module 01 dataset wording

on:
  push:
    branches:
      - didactic-m01-standard
    paths:
      - '.github/workflows/m01-canonical-wording.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace internal canonical wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'analysis/01_preprocessing_pt.Rmd': ('Para o conjunto canônico, essas verificações devem indicar correspondência completa entre as duas fontes.', 'Para o conjunto de dados analisado, essas verificações devem indicar correspondência completa entre as duas fontes.'),
            'analysis/01_preprocessing_en.Rmd': ('For the canonical dataset, these checks should indicate complete correspondence between the two sources.', 'For the analyzed dataset, these checks should indicate complete correspondence between the two sources.'),
          }
          for filename, (old, new) in edits.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            if text.count(old) != 1:
              raise SystemExit(f'{filename}: expected one occurrence, found {text.count(old)}')
            p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd
          git commit -m "Use reader-facing dataset wording in Module 01"
          git push origin HEAD:didactic-m01-standard
