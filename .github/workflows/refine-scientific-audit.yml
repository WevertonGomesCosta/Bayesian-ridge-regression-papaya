name: Refine scientific audit wording

on:
  push:
    branches:
      - scientific-product-audit

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scientific-product-audit
      - name: Refine audited text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def change(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != expected:
                  raise RuntimeError(f'{path}: expected {expected} occurrences, found {n}: {old!r}')
              p.write_text(text.replace(old, new, expected), encoding='utf-8', newline='\n')

          change(
              'analysis/04_results_en.Rmd',
              'Following Silva et al. [@silva2021brrguava], additive genetic variance in the\nRR-BLUP/BRR analogue is obtained from the common marker variance and the\n\\(\\sum 2pq\\) denominator. Fold-level accuracy is defined as\n\\(r_f/\\sqrt{H_f^2}\\).',
              'Following Silva et al. [@silva2021brrguava], a marker-based additive-variance\nanalogue is obtained from the common marker variance and the \\(\\sum 2pq\\)\ndenominator. Fold-level adjusted accuracy is defined as\n\\(r_f/\\sqrt{H_f^2}\\). The resulting \\(H^2\\) is reported as a model-based\nheritability analogue rather than as an independent classical estimate of\nnarrow-sense heritability.'
          )
          change(
              'analysis/04_results_pt.Rmd',
              'Seguindo Silva et al. [@silva2021brrguava], a variância genética aditiva do\nanálogo RR-BLUP/BRR é obtida a partir da variância comum dos marcadores e do\ndenominador \\(\\sum 2pq\\). A acurácia por fold é definida como\n\\(r_f/\\sqrt{H_f^2}\\).',
              'Seguindo Silva et al. [@silva2021brrguava], um análogo de variância aditiva\nbaseado em marcadores é obtido a partir da variância comum dos marcadores e do\ndenominador \\(\\sum 2pq\\). A acurácia ajustada por fold é definida como\n\\(r_f/\\sqrt{H_f^2}\\). O \\(H^2\\) resultante é apresentado como um análogo de\nherdabilidade baseado no modelo, e não como uma estimativa clássica independente\nde herdabilidade no sentido restrito.'
          )
          change(
              'analysis/04_results_en.Rmd',
              'caption = "Predictive-evidence classification of the traits"',
              'caption = "OOF predictive direction of the traits"'
          )
          change(
              'analysis/04_results_pt.Rmd',
              'caption = "Classificação da evidência preditiva das características"',
              'caption = "Direção preditiva OOF das características"'
          )
          change('analysis/04_results_en.Rmd', '```{r predictive-evidence-table}', '```{r oof-direction-table}')
          change('analysis/04_results_pt.Rmd', '```{r predictive-evidence-table}', '```{r oof-direction-table}')
          change(
              'analysis/04_results_pt.Rmd',
              'A recorrência é descritiva: conta em quantas características elegíveis para seleção cada\nindivíduo aparece entre os 20% mais favoráveis.',
              'A recorrência é descritiva: conta, entre as características elegíveis para\nseleção, em quantas cada indivíduo aparece entre os 20% mais favoráveis.'
          )
          change(
              'analysis/05_results_en.Rmd',
              '"Traits with positive OOF predictive ability"',
              '"Traits with positive OOF correlation"'
          )
          change(
              'analysis/05_results_pt.Rmd',
              '"Características com capacidade preditiva OOF positiva"',
              '"Características com correlação OOF positiva"'
          )
          change(
              'analysis/05_results_en.Rmd',
              'Recurrence summarizes how many selection-eligible traits place each individual among the\nmost favorable 20%.',
              'Recurrence summarizes, across selection-eligible traits, how many place each\nindividual among the most favorable 20%.'
          )
          change(
              'analysis/05_results_pt.Rmd',
              'A recorrência resume em quantas características elegíveis para seleção cada indivíduo\naparece entre os 20% mais favoráveis.',
              'A recorrência resume, entre as características elegíveis para seleção, em quantas\ncada indivíduo aparece entre os 20% mais favoráveis.'
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd
          git rm .github/workflows/refine-scientific-audit.yml
          git commit -m "Refine audited scientific wording"
          git push origin HEAD:scientific-product-audit
