name: Final Module 01 tabular consistency

on:
  push:
    branches:
      - final-m01-tabular-consistency

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Apply final Module 01 tabular consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-m01-tabular-consistency
          fetch-depth: 0
      - name: Standardize remaining SSR preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'analysis/01_preprocessing_pt.Rmd': (
              '# Estrutura inicial da matriz SSR.\nssr_raw[1:6, 1:8]',
              '# Mostra uma prévia da matriz SSR já organizada.\nas.data.frame(ssr_raw[1:6, 1:8]) |>\n  tabela_html(caption = "Prévia da matriz SSR organizada")'
            ),
            'analysis/01_preprocessing_en.Rmd': (
              '# Initial structure of the SSR matrix.\nssr_raw[1:6, 1:8]',
              '# Show a preview of the organized SSR matrix.\nas.data.frame(ssr_raw[1:6, 1:8]) |>\n  format_table(caption = "Preview of the organized SSR matrix")'
            )
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one SSR preview')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          changed=$(git diff --name-only)
          expected=$'analysis/01_preprocessing_en.Rmd\nanalysis/01_preprocessing_pt.Rmd'
          test "$changed" = "$expected"
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Weverton Gomes da Costa"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd
          git commit -m "Standardize final Module 01 tabular preview"
          git push origin HEAD:final-m01-tabular-consistency
