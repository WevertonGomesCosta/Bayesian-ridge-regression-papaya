name: Refine OOF ranking interpretation

on:
  push:
    branches:
      - refine-oof-ranking-interpretation

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-oof-ranking-interpretation
          fetch-depth: 0

      - name: Refine M04 and M05 interpretation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for label, old, new in replacements:
                  n = text.count(old)
                  if n != 1:
                      raise RuntimeError(f'{path} / {label}: expected 1 occurrence, found {n}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='\n')

          # ---------------- M04 English ----------------
          p = 'analysis/04_results_en.Rmd'
          text = Path(p).read_text(encoding='utf-8')
          text = text.replace('selection_eligible_traits', 'positive_oof_traits')
          text = text.replace('selection-eligible traits', 'traits with positive OOF correlation')
          text = text.replace('supported trait', 'trait with positive OOF correlation')
          Path(p).write_text(text, encoding='utf-8', newline='\n')
          edit(p, [
            ('final description',
             'Finally, the selected method, predictive and DIC winners, and the descriptive\npredictive-evidence classification are brought together for each trait.',
             'Finally, the selected method, predictive and DIC winners, OOF direction, and a\nnominal signal class are brought together for each trait. The nominal class is\nreported only to make weak positive correlations explicit; it is not used as a\nselection gate.'),
            ('direction mutate',
             '    OOF_predictive_direction = if_else(\n      r > 0,\n      "positive",\n      "nonpositive"\n    )',
             '    OOF_predictive_direction = if_else(\n      r > 0,\n      "positive",\n      "nonpositive"\n    ),\n    OOF_nominal_signal = case_when(\n      r > 0 & p_value < 0.05 ~ "positive_nominal_p_lt_0.05",\n      r > 0 ~ "positive_nominal_p_ge_0.05",\n      TRUE ~ "nonpositive"\n    )'),
            ('selection table columns',
             '    Selection_status, OOF_predictive_direction\n',
             '    Selection_status, OOF_predictive_direction, OOF_nominal_signal\n'),
            ('selected oof join',
             '    model_selection |>\n      select(Trait, Selected_method, OOF_predictive_direction),\n',
             '    model_selection |>\n      select(\n        Trait, Selected_method, OOF_predictive_direction,\n        OOF_nominal_signal, r, p_value\n      ),\n'),
            ('selected oof transmute',
             '    IND, Trait, Fold, Method, OOF_predictive_direction,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component\n',
             '    IND, Trait, Fold, Method, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r = r, OOF_nominal_p_value = p_value,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component\n'),
            ('section heading',
             '## 10. Proportional selection by trait\n',
             '## 10. Exploratory proportional candidate ranking by trait\n'),
            ('section interpretation',
             'Selection is restricted to traits for which the selected method has positive\nOOF correlation. Nominal p-values remain descriptive and do not determine\neligibility. Within each eligible trait, the 20% of individuals with the\nlargest oriented score are selected; this 20% is a configurable tutorial rule,\nnot an estimated optimal selection intensity. For traits whose objective is to\ndecrease, the score is the negative genomic value.',
             'Candidate rankings are shown for traits whose selected method has positive OOF\ncorrelation. Nominal p-values remain descriptive and do not determine whether a\nranking is produced. Positive correlations with nominal `p >= 0.05` are kept\nexplicitly as weak/exploratory signals and should not be interpreted as\ndemonstrated predictive utility. Within each positive-OOF trait, the 20% of\nindividuals with the largest oriented score are listed; this 20% is a\nconfigurable tutorial rule, not an estimated optimal selection intensity. For\ntraits whose objective is to decrease, the score is the negative genomic\nvalue.'),
            ('selected individual columns',
             '    Genomic_value, Selection_score, OOF_predictive_direction,\n    Selection_proportion, N_available, N_selected\n',
             '    Genomic_value, Selection_score, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r, OOF_nominal_p_value,\n    Selection_proportion, N_available, N_selected\n'),
            ('recurrence intro',
             'Recurrence is descriptive: it counts the traits with positive OOF correlation for which each\nindividual belongs to the most favorable 20%. No weights are used and no\nmulti-trait selection index is constructed.',
             'Recurrence is descriptive: among traits with positive OOF correlation, it counts\nhow many place each individual among the most favorable 20%. Weak positive OOF\nsignals remain exploratory. No weights are used and no multi-trait selection\nindex is constructed.'),
            ('recurrence caption',
             'caption = "Distribution of recurrence across traits with positive OOF correlation"',
             'caption = "Distribution of recurrence across traits with positive OOF correlation"')
          ])

          # ---------------- M04 Portuguese ----------------
          p = 'analysis/04_results_pt.Rmd'
          text = Path(p).read_text(encoding='utf-8')
          text = text.replace('selection_eligible_traits', 'positive_oof_traits')
          text = text.replace('características elegíveis para seleção', 'características com correlação OOF positiva')
          text = text.replace('característica elegível para seleção', 'característica com correlação OOF positiva')
          Path(p).write_text(text, encoding='utf-8', newline='\n')
          edit(p, [
            ('final description',
             'Por fim, são reunidos o método selecionado, os vencedores preditivo e por DIC e\na classificação descritiva da evidência preditiva de cada característica.',
             'Por fim, são reunidos o método selecionado, os vencedores preditivo e por DIC, a\ndireção OOF e uma classe nominal do sinal de cada característica. A classe\nnominal é apresentada apenas para tornar explícitas correlações positivas\nfracas; ela não é usada como filtro de seleção.'),
            ('direction mutate',
             '    OOF_predictive_direction = if_else(\n      r > 0,\n      "positive",\n      "nonpositive"\n    )',
             '    OOF_predictive_direction = if_else(\n      r > 0,\n      "positive",\n      "nonpositive"\n    ),\n    OOF_nominal_signal = case_when(\n      r > 0 & p_value < 0.05 ~ "positive_nominal_p_lt_0.05",\n      r > 0 ~ "positive_nominal_p_ge_0.05",\n      TRUE ~ "nonpositive"\n    )'),
            ('selection table columns',
             '    Selection_status, OOF_predictive_direction\n',
             '    Selection_status, OOF_predictive_direction, OOF_nominal_signal\n'),
            ('selected oof join',
             '    model_selection |>\n      select(Trait, Selected_method, OOF_predictive_direction),\n',
             '    model_selection |>\n      select(\n        Trait, Selected_method, OOF_predictive_direction,\n        OOF_nominal_signal, r, p_value\n      ),\n'),
            ('selected oof transmute',
             '    IND, Trait, Fold, Method, OOF_predictive_direction,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component\n',
             '    IND, Trait, Fold, Method, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r = r, OOF_nominal_p_value = p_value,\n    Selection_objective, Ranking_rule,\n    Genomic_value = Genomic_component\n'),
            ('section heading',
             '## 10. Seleção proporcional por característica\n',
             '## 10. Ranking exploratório proporcional de candidatos por característica\n'),
            ('section interpretation',
             'A seleção é restrita às características para as quais o método selecionado\napresenta correlação OOF positiva. Os p-valores nominais permanecem descritivos\ne não determinam a elegibilidade. Em cada característica elegível, são\nselecionados os 20% de indivíduos com maior escore orientado; essa proporção de\n20% é uma regra configurável do tutorial, e não uma intensidade ótima estimada.\nPara características cujo objetivo é diminuir, o escore é o negativo do valor\ngenômico.',
             'Os rankings de candidatos são apresentados para as características cujo método\nselecionado possui correlação OOF positiva. Os p-valores nominais permanecem\ndescritivos e não determinam se um ranking é produzido. Correlações positivas\ncom `p >= 0,05` são mantidas explicitamente como sinais fracos/exploratórios e\nnão devem ser interpretadas como utilidade preditiva demonstrada. Em cada\ncaracterística com OOF positivo, são listados os 20% de indivíduos com maior\nescore orientado; essa proporção é uma regra configurável do tutorial, e não\numa intensidade ótima estimada. Para características cujo objetivo é diminuir,\no escore é o negativo do valor genômico.'),
            ('selected individual columns',
             '    Genomic_value, Selection_score, OOF_predictive_direction,\n    Selection_proportion, N_available, N_selected\n',
             '    Genomic_value, Selection_score, OOF_predictive_direction,\n    OOF_nominal_signal, OOF_r, OOF_nominal_p_value,\n    Selection_proportion, N_available, N_selected\n'),
            ('recurrence intro',
             'A recorrência é descritiva: conta, entre as características com correlação OOF positiva, em quantas cada indivíduo aparece entre os 20% mais favoráveis. Não são usados pesos e não é\nconstruído índice de seleção multicaracterística.',
             'A recorrência é descritiva: entre as características com correlação OOF positiva,\nconta em quantas cada indivíduo aparece entre os 20% mais favoráveis. Sinais OOF\npositivos fracos permanecem exploratórios. Não são usados pesos e não é\nconstruído índice de seleção multicaracterística.')
          ])

          # ---------------- M05 English ----------------
          p = 'analysis/05_results_en.Rmd'
          text = Path(p).read_text(encoding='utf-8')
          text = text.replace('selection_eligible_traits', 'positive_oof_traits')
          text = text.replace('selection-eligible traits', 'traits with positive OOF correlation')
          Path(p).write_text(text, encoding='utf-8', newline='\n')
          edit(p, [
            ('section heading', '## 10. Proportional selection by trait\n', '## 10. Exploratory proportional candidate ranking by trait\n'),
            ('section text',
             'Selection is presented for traits whose selected method has positive OOF\ncorrelation. Nominal p-values are descriptive and do not determine eligibility.\nThe proportion used is `r sprintf("%.0f%%", 100 * selection_proportion)` of\nthe individuals within each trait; it is a configurable tutorial rule rather\nthan an estimated optimal intensity. Rankings use cross-fitted OOF genomic\nvalues, not final breeding values from a model refitted to all phenotypes.',
             'Candidate rankings are presented for traits whose selected method has positive\nOOF correlation. Nominal p-values are descriptive and do not determine whether\na ranking is shown. Rankings with nominal `p >= 0.05` are explicitly\nexploratory and should not be interpreted as demonstrated predictive utility.\nThe proportion shown is `r sprintf("%.0f%%", 100 * selection_proportion)` of\nthe individuals within each trait and is a configurable tutorial rule rather\nthan an estimated optimal intensity. Rankings use cross-fitted OOF genomic\nvalues, not final breeding values from a model refitted to all phenotypes.'),
            ('selection sizes join',
             'selection_sizes_display <- selection_sizes |>\n  left_join(\n    selection_objectives |>\n      select(Trait, Selection_objective),\n    by = "Trait"\n  ) |>\n',
             'selection_sizes_display <- selection_sizes |>\n  left_join(\n    selection_objectives |>\n      select(Trait, Selection_objective),\n    by = "Trait"\n  ) |>\n  left_join(\n    model_selection |>\n      select(Trait, r, p_value, OOF_nominal_signal),\n    by = "Trait"\n  ) |>\n'),
            ('selection sizes columns',
             '    Trait,\n    Objective,\n    Selection_proportion,\n',
             '    Trait,\n    Objective,\n    r,\n    p_value,\n    OOF_nominal_signal,\n    Selection_proportion,\n'),
            ('caption', 'caption = "Proportion and number of selected individuals by trait"', 'caption = "Exploratory candidate-ranking summary by positive-OOF trait"'),
            ('preview columns',
             '    Selection_objective, Genomic_value, Selection_score\n',
             '    Selection_objective, Genomic_value, Selection_score,\n    OOF_r, OOF_nominal_p_value, OOF_nominal_signal\n'),
            ('preview caption', 'caption = "Top five selected individuals by trait"', 'caption = "Top five candidates in each positive-OOF trait ranking"'),
            ('recurrence prose',
             'Recurrence summarizes, across traits with positive OOF correlation, how many place each\nindividual among the most favorable 20%. `N_traits`, selection frequency, and ranks are not combined\ninto a multi-trait index.',
             'Recurrence summarizes, across traits with positive OOF correlation, how many\nplace each individual among the most favorable 20%. Recurrence that depends on\nweak positive OOF signals should remain exploratory. `N_traits`, selection\nfrequency, and ranks are not combined into a multi-trait index.')
          ])

          # ---------------- M05 Portuguese ----------------
          p = 'analysis/05_results_pt.Rmd'
          text = Path(p).read_text(encoding='utf-8')
          text = text.replace('selection_eligible_traits', 'positive_oof_traits')
          text = text.replace('características elegíveis para seleção', 'características com correlação OOF positiva')
          Path(p).write_text(text, encoding='utf-8', newline='\n')
          edit(p, [
            ('section heading', '## 10. Seleção proporcional por característica\n', '## 10. Ranking exploratório proporcional de candidatos por característica\n'),
            ('section text',
             'A seleção é apresentada para as características cujo método selecionado possui\ncorrelação OOF positiva. Os p-valores nominais são descritivos e não determinam\na elegibilidade. A proporção utilizada é de\n`r sprintf("%.0f%%", 100 * selection_proportion)` dos indivíduos por\ncaracterística; trata-se de uma regra configurável do tutorial, e não de uma\nintensidade ótima estimada. Os rankings utilizam valores genômicos OOF\ncross-fitted, e não valores genéticos finais de um modelo reajustado com todos\nos fenótipos.',
             'Os rankings de candidatos são apresentados para as características cujo método\nselecionado possui correlação OOF positiva. Os p-valores nominais são\ndescritivos e não determinam se um ranking é apresentado. Rankings com\n`p >= 0,05` são explicitamente exploratórios e não devem ser interpretados como\nutilidade preditiva demonstrada. A proporção apresentada é de\n`r sprintf("%.0f%%", 100 * selection_proportion)` dos indivíduos por\ncaracterística e constitui uma regra configurável do tutorial, e não uma\nintensidade ótima estimada. Os rankings utilizam valores genômicos OOF\ncross-fitted, e não valores genéticos finais de um modelo reajustado com todos\nos fenótipos.'),
            ('selection sizes join',
             'selection_sizes_display <- selection_sizes |>\n  left_join(\n    selection_objectives |>\n      select(Trait, Selection_objective),\n    by = "Trait"\n  ) |>\n',
             'selection_sizes_display <- selection_sizes |>\n  left_join(\n    selection_objectives |>\n      select(Trait, Selection_objective),\n    by = "Trait"\n  ) |>\n  left_join(\n    model_selection |>\n      select(Trait, r, p_value, OOF_nominal_signal),\n    by = "Trait"\n  ) |>\n'),
            ('selection sizes columns',
             '    Trait,\n    Objective,\n    Selection_proportion,\n',
             '    Trait,\n    Objective,\n    r,\n    p_value,\n    OOF_nominal_signal,\n    Selection_proportion,\n'),
            ('caption', 'caption = "Proporção e número de indivíduos selecionados por característica"', 'caption = "Resumo exploratório do ranking de candidatos por característica com OOF positivo"'),
            ('preview columns',
             '    Selection_objective, Genomic_value, Selection_score\n',
             '    Selection_objective, Genomic_value, Selection_score,\n    OOF_r, OOF_nominal_p_value, OOF_nominal_signal\n'),
            ('preview caption', 'caption = "Cinco primeiros indivíduos selecionados por característica"', 'caption = "Cinco primeiros candidatos do ranking em cada característica com OOF positivo"'),
            ('recurrence prose',
             'A recorrência resume, entre as características com correlação OOF positiva, em quantas\ncada indivíduo aparece entre os 20% mais favoráveis. `N_traits`, frequência de seleção e rankings não são\ncombinados em um índice multicaracterística.',
             'A recorrência resume, entre as características com correlação OOF positiva, em\nquantas cada indivíduo aparece entre os 20% mais favoráveis. Recorrências que\ndependam de sinais OOF positivos fracos devem permanecer exploratórias.\n`N_traits`, frequência de seleção e rankings não são combinados em um índice\nmulticaracterística.')
          ])

          # Guardrails.
          for p in [
              'analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd']:
              txt = Path(p).read_text(encoding='utf-8')
              if 'selection_eligible_traits' in txt:
                  raise RuntimeError(f'{p}: old eligibility variable remains')
              if 'OOF_nominal_signal' not in txt:
                  raise RuntimeError(f'{p}: nominal signal class missing')
          PY

      - name: Validate R syntax and diff
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          for f in ['analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd','analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd']:
              lines=Path(f).read_text(encoding='utf-8').splitlines()
              chunks=[]; current=None
              for line in lines:
                  s=line.strip()
                  if current is None and s.startswith('```{r') and s.endswith('}'):
                      current=[]; continue
                  if current is not None and s=='```':
                      chunks.append(current); current=None; continue
                  if current is not None: current.append(line)
              out=Path('/tmp')/(Path(f).stem+'.R')
              out.write_text('\n\n'.join('\n'.join(c) for c in chunks),encoding='utf-8')
          PY
          for f in /tmp/04_results_en.R /tmp/04_results_pt.R /tmp/05_results_en.R /tmp/05_results_pt.R; do
            Rscript --vanilla -e "parse(file='$f'); cat('OK\n')" >/dev/null
          done
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd | sort)"
          test "$changed" = "$expected"

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd
          git rm .github/workflows/refine-oof-ranking.yml
          git commit -m "Clarify exploratory OOF candidate rankings"
          git push origin HEAD:refine-oof-ranking-interpretation
