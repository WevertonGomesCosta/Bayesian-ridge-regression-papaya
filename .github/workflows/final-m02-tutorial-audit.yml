          ],
          }

          for path_str, reps in replacements.items():
              path = Path(path_str)
              original = path.read_text(encoding='utf-8')
              original_sig = executable_signature(original)
              text = original
              for old, new in reps:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_str}: expected exactly one match, found {count}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              if executable_signature(text) != original_sig:
                  raise SystemExit(f'{path_str}: executable R code changed')
              path.write_text(text, encoding='utf-8')

          print('PASS: Module 02 PT/EN tutorial prose/comments refined with executable R code unchanged.')
