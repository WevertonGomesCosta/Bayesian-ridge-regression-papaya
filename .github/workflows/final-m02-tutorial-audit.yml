              ),
              (
                  'A estrutura recebida do pré-processamento é mostrada antes da codificação dos\nmarcadores.',
                  'Antes da codificação dos marcadores, a tabela seguinte confere a estrutura recebida do Módulo 01: número de indivíduos e características, quantidade de locos antes e depois do controle de qualidade e número de famílias. Ela funciona como ponto de controle entre os módulos; nenhum novo filtro é aplicado neste chunk.'
              ),
              (
                  'Cada código SSR contém dois rótulos alélicos. O código `12`, por exemplo,\nrepresenta uma cópia do alelo 1 e uma cópia do alelo 2, enquanto `22`\nrepresenta duas cópias do alelo 2. Uma coluna de dosagem é criada para cada\nalelo observado em cada loco mantido.',
                  'Cada código SSR contém dois rótulos alélicos. O código `12`, por exemplo, representa uma cópia do alelo 1 e uma cópia do alelo 2, enquanto `22` representa duas cópias do alelo 2. Para cada alelo observado em cada loco mantido, a dosagem de um indivíduo é calculada como a soma de duas funções indicadoras: uma para cada posição alélica do genótipo. Assim, a coluna assume 0, 1 ou 2 conforme o indivíduo carregue zero, uma ou duas cópias daquele alelo.\n\nUma coluna é criada para cada combinação loco–alelo, e chamadas SSR ausentes permanecem como `NA` até a etapa de imputação. Antes de qualquer filtragem de colunas alélicas, as dosagens de todos os alelos de um loco diploide somam 2 para cada genótipo observado. Essa propriedade será usada posteriormente como diagnóstico da codificação.'
