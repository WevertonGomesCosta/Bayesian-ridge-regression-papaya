                  'Todas as colunas alélicas que atendem aos filtros declarados são mantidas; nenhuma categoria é descartada artificialmente apenas para impor posto completo. Quando todos os alelos de um loco permanecem representados, suas dosagens somam 2 em cada indivíduo diploide e existe uma dependência linear exata entre essas colunas. Por isso, coeficientes de alelos individuais não são interpretados isoladamente; os módulos seguintes se concentram nas predições e nos valores genômicos.\n\nNo conjunto canônico, as 72 colunas de dosagem não representam 72 dimensões independentes. O diagnóstico compara o posto observado de `M` com `sum(k_l - 1)`, em que `k_l` é o número de colunas alélicas mantidas no loco `l`; também verifica se a soma das dosagens por loco continua igual a 2, se a centralização de `M` é numericamente correta e se `G` pode ser reconstruída a partir de `M` e do mesmo denominador. Simetria, posto, diagonal e menor autovalor completam a checagem numérica de `G`.'
