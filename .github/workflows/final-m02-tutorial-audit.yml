name: Final Module 02 tutorial audit

on:
  push:
    branches:
      - final-m02-tutorial-audit

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Module 02 PT and EN tutorial text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = {
              'analysis/02_matrices_pt.Rmd': 'pt',
              'analysis/02_matrices_en.Rmd': 'en',
          }

          def executable_signature(text):
              chunks = []
              lines = text.splitlines()
              inside = False
              current = []
              for line in lines:
                  if re.match(r'^\s*```\{r(?:[\s,}]|$)', line):
                      inside = True
                      current = []
                      continue
                  if inside and re.match(r'^\s*```\s*$', line):
                      cleaned = []
                      for x in current:
                          if re.match(r'^\s*#', x):
                              continue
                          x = re.sub(r'\s+', '', x)
                          if x:
                              cleaned.append(x)
                      chunks.append('\n'.join(cleaned))
                      inside = False
                      continue
                  if inside:
                      current.append(line)
              return '\n---CHUNK---\n'.join(chunks)

          replacements = {
          'analysis/02_matrices_pt.Rmd': [
              (
                  '---\n\n```{r setup, include=FALSE}',
                  '---\n\nO chunk oculto a seguir define apenas opções de renderização compartilhadas por esta página. Ele não carrega os objetos analíticos, não constrói matrizes e não interfere na validação cruzada.\n\n```{r setup, include=FALSE}'
              ),
              (
                  'cenário transdutivo de candidatos genotipados e não deve ser interpretado como\nvalidação externa em uma nova população genotípica.\n\n## 2. Pacotes e objeto de entrada',
                  'cenário transdutivo de candidatos genotipados e não deve ser interpretado como\nvalidação externa em uma nova população genotípica.\n\nAo final do módulo, o leitor terá quatro componentes que serão reutilizados diretamente no Módulo 03: a matriz de efeitos fixos `X`, a matriz centralizada de marcadores `M`, a matriz de relacionamento genômico `G` e a tabela `cv_folds` que identifica o fold de validação de cada indivíduo. Os diagnósticos apresentados ao longo da página verificam se a codificação alélica, a centralização, o relacionamento genômico e a estratificação por família são coerentes com esse desenho.\n\n## 2. Pacotes e objeto de entrada'
              ),
              (
                  '## 2. Pacotes e objeto de entrada\n\n```{r pacotes}',
