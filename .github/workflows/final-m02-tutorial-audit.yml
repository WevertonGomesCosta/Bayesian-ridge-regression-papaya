          git diff --check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Parse Module 02 chunks and inline R
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/02_matrices_pt.Rmd', 'analysis/02_matrices_en.Rmd')
          n_chunks <- 0L
          n_inline <- 0L
          for (f in files) {
            x <- readLines(f, warn = FALSE, encoding = 'UTF-8')
            inside <- FALSE
            prose <- character()
            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl = TRUE)) {
                inside <- TRUE
                next
              }
              if (inside && grepl('^\\s*```\\s*$', line, perl = TRUE)) {
                inside <- FALSE
                next
              }
              if (!inside) prose <- c(prose, line)
            }
            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl = TRUE)))
            if (length(inline)) {
              for (expr in inline) {
                code <- sub('^`r ', '', expr)
                code <- sub('`$', '', code)
                parse(text = code)
                n_inline <- n_inline + 1L
              }
            }
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl = TRUE)
            for (s in starts) {
              rel <- which(grepl('^\\s*```\\s*$', x[(s + 1L):length(x)], perl = TRUE))[1]
              if (is.na(rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + rel
              code <- if (e > s + 1L) x[(s + 1L):(e - 1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text = code)
              n_chunks <- n_chunks + 1L
            }
          }
          cat('Parsed Module 02 R chunks:', n_chunks, '\n')
          cat('Parsed Module 02 inline R expressions:', n_inline, '\n')
          RS

      - name: Commit only Module 02 source files
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' analysis/02_matrices_en.Rmd analysis/02_matrices_pt.Rmd | sort)"
          test "$changed" = "$expected"
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/02_matrices_pt.Rmd analysis/02_matrices_en.Rmd
          git commit -m "Refine Module 02 tutorial guidance"
          git push origin HEAD:final-m02-tutorial-audit
