                  'All allele columns satisfying the declared filters are retained; no category is artificially discarded merely to force full rank. When all alleles at a locus remain represented, their dosages sum to 2 in each diploid individual and an exact linear dependency exists among those columns. Individual allele coefficients are therefore not interpreted in isolation; later modules focus on predictions and genomic values.\n\nIn the canonical dataset, the 72 dosage columns do not represent 72 independent dimensions. The diagnostic compares the observed rank of `M` with `sum(k_l - 1)`, where `k_l` is the number of retained allele columns at locus `l`; it also checks whether within-locus dosage still sums to 2, whether `M` is numerically centered, and whether `G` can be reconstructed from `M` and the same denominator. Symmetry, rank, diagonal, and smallest eigenvalue complete the numerical check of `G`.'
              ),
              (
                  'The next step organizes and saves the generated outputs for use in the downstream modules.',
