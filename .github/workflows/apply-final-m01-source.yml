name: Apply final Module 01 source refinements

on:
  push:
    branches:
      - final-m01-tutorial-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the audited Module 01 transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          wf = Path('.github/workflows/final-m01-tutorial-audit.yml').read_text(encoding='utf-8')
          lines = wf.splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          collected = []
          for line in lines[start + 1:]:
              if line.strip() == 'PY':
                  break
              collected.append(line)
          script = textwrap.dedent('\n'.join(collected)) + '\n'
          subprocess.run(['python', '-'], input=script, text=True, check=True)

          # Normalize the explanatory MathJax formula to one LaTeX backslash.
          for name in ('analysis/01_preprocessing_pt.Rmd', 'analysis/01_preprocessing_en.Rmd'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace(r'\\bar{y}', r'\bar{y}')
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Validate Module 01 R chunks and inline R expressions
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/01_preprocessing_pt.Rmd', 'analysis/01_preprocessing_en.Rmd')
          n_chunks <- 0L
          n_inline <- 0L

          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            inside <- FALSE
            prose <- character()

            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl=TRUE)) {
                inside <- TRUE
                next
              }
              if (inside && grepl('^\\s*```\\s*$', line, perl=TRUE)) {
                inside <- FALSE
                next
              }
              if (!inside) prose <- c(prose, line)
            }

            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl=TRUE)))
            if (length(inline)) {
              for (expr in inline) {
                expr_code <- sub('^`r ', '', expr)
                expr_code <- sub('`$', '', expr_code)
                parse(text=expr_code)
                n_inline <- n_inline + 1L
              }
            }

            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + e_rel
              code <- if (e > s + 1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code)
              n_chunks <- n_chunks + 1L
            }
          }

          cat('Parsed Module 01 R chunks:', n_chunks, '\n')
          cat('Parsed Module 01 inline R expressions:', n_inline, '\n')
          RS

      - name: Commit only Module 01 source files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'analysis/01_preprocessing_pt.Rmd',
              'analysis/01_preprocessing_en.Rmd',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd
          git commit -m "Refine Module 01 tutorial guidance"
          git push origin HEAD:final-m01-tutorial-audit
