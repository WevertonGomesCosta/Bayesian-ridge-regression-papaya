name: Validate didactic Module 01 standard

on:
  push:
    branches:
      - didactic-m01-standard
    paths:
      - '.github/workflows/m01-didactic-standard.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Apply didactic standard to Module 01 PT/EN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return text.replace(old, new, 1)

          p = Path('analysis/01_preprocessing_pt.Rmd')
          pt = p.read_text(encoding='utf-8')
          pt = replace_once(pt, 'O chunk oculto a seguir define somente opções de renderização compartilhadas por esta página. Ele não lê dados, não altera objetos analíticos e não executa nenhuma etapa do pré-processamento.\n\n', '', 'PT hidden-setup prose')
          pt = replace_once(pt, 'Ao final da etapa, o leitor terá três objetos centrais: a matriz fenotípica alinhada, a matriz SSR após o controle de qualidade dos locos e os metadados com indivíduo e família. Os diagnósticos produzidos ao longo da página servem para verificar se esses objetos podem seguir para a construção das matrizes genômicas.', 'O pré-processamento produz três objetos centrais para as etapas seguintes: a matriz fenotípica alinhada, a matriz SSR após o controle de qualidade dos locos e os metadados com indivíduo e família. Os diagnósticos apresentados ao longo do módulo verificam a consistência desses objetos antes da construção das matrizes genômicas.', 'PT reader objective')
          pt = replace_once(pt, '''## 2. Pacotes e caminhos dos arquivos\n\nO primeiro chunk carrega apenas os pacotes usados para leitura das planilhas, manipulação de dados, gráficos, tabelas e caminhos portáveis. As mensagens de inicialização são suprimidas para manter a página centrada nas etapas analíticas.\n\n```{r pacotes}\nsuppressPackageStartupMessages({\n  library(readxl)\n  library(dplyr)\n  library(tidyr)\n  library(ggplot2)\n  library(knitr)\n  library(here)\n})\n```\n\nA etapa seguinte define os caminhos dos arquivos usados como entradas e saídas do módulo. Esses caminhos apenas organizam a leitura e a persistência dos resultados e não constituem parâmetros estatísticos.\n\nDois parâmetros de controle são fixados neste ponto. `CALL_RATE_MIN = 0.90` exige que pelo menos 90% das chamadas de um loco estejam disponíveis. Como o painel possui 150 indivíduos, isso corresponde a pelo menos 135 genótipos observados por loco. Em conjunto com a exigência de pelo menos duas classes genotípicas, o critério evita manter locos com informação insuficiente para representar variação. `PHENOTYPE_DISTANCE_THRESHOLD = 4` identifica, apenas para inspeção, observações a pelo menos quatro desvios-padrão da média da característica. Essa regra é diagnóstica: nenhum fenótipo é removido, winsorizado ou alterado por esse limite.''', '''## 2. Pacotes e caminhos dos arquivos\n\nOs pacotes utilizados neste módulo têm funções distintas:\n\n- `readxl`: leitura das planilhas Excel com os dados genotípicos e fenotípicos;\n- `dplyr`: seleção, transformação e organização das tabelas;\n- `tidyr`: reorganização dos dados entre formatos largo e longo;\n- `ggplot2`: construção dos gráficos de controle de qualidade e distribuição fenotípica;\n- `knitr`: formatação das tabelas apresentadas no tutorial;\n- `here`: construção de caminhos de arquivos independentes do diretório local do computador.\n\n```{r pacotes, warning=FALSE, message=FALSE}\nlibrary(readxl)  # Leitura de arquivos Excel.\nlibrary(dplyr)   # Manipulação e transformação de tabelas.\nlibrary(tidyr)   # Reorganização de dados entre formatos largo e longo.\nlibrary(ggplot2) # Construção de gráficos.\nlibrary(knitr)   # Formatação de tabelas e saídas do R Markdown.\nlibrary(here)    # Construção de caminhos portáveis dentro do projeto.\n```\n\nPara manter a apresentação consistente, todas as tabelas são formatadas pela função `tabela_html()`. As tabelas ocupam a largura disponível da página e recebem rolagem horizontal quando o conteúdo ultrapassa essa largura. Essa função altera somente a apresentação; os dados permanecem inalterados.\n\n```{r formatacao-tabelas}\ntabela_html <- function(x, caption = NULL, digits = NULL, col.names = NULL) {\n  tabela <- knitr::kable(\n    x,\n    format = "html",\n    caption = caption,\n    digits = digits,\n    col.names = col.names,\n    table.attr = paste0(\n      'class="table table-striped table-hover" ',\n      'style="width:100%; margin-bottom:0;"'\n    )\n  )\n  knitr::asis_output(\n    paste0(\n      '<div style="width:100%; overflow-x:auto; margin-bottom:1.25rem;">',\n      tabela,\n      '</div>'\n    )\n  )\n}\n```\n\nOs caminhos definidos a seguir organizam os arquivos de entrada e a pasta de saída; eles não constituem parâmetros estatísticos.\n\nDois parâmetros de controle são fixados:\n\n- `CALL_RATE_MIN = 0.90`: exige que pelo menos 90% das chamadas de um loco estejam disponíveis. Como o painel possui 150 indivíduos, isso corresponde a pelo menos 135 genótipos observados por loco. Em conjunto com a exigência de pelo menos duas classes genotípicas, o critério evita manter locos com informação insuficiente para representar variação.\n- `PHENOTYPE_DISTANCE_THRESHOLD = 4`: identifica, apenas para inspeção, observações a pelo menos quatro desvios-padrão da média da característica. Essa regra é diagnóstica: nenhum fenótipo é removido, limitado a um valor de corte ou alterado por esse critério.''', 'PT packages/parameters')

          repl_pt = [
            ('|>\n  kable(caption = "Dimensões das planilhas utilizadas")', '|>\n  tabela_html(caption = "Dimensões das planilhas utilizadas")'),
            ('kable(\n  alignment,\n  caption = "Alinhamento entre os dados genotípicos e fenotípicos"\n)', 'tabela_html(\n  alignment,\n  caption = "Alinhamento entre os dados genotípicos e fenotípicos"\n)'),
            ('kable(\n  identifier_summary,\n  caption = "Resumo dos identificadores e das colunas"\n)', 'tabela_html(\n  identifier_summary,\n  caption = "Resumo dos identificadores e das colunas"\n)'),
            ('|>\n  kable(caption = "Número de indivíduos por família")', '|>\n  tabela_html(caption = "Número de indivíduos por família")'),
            ('kable(\n  locus_audit,\n  digits = 3,\n  caption = "Controle de qualidade dos locos SSR"\n)', 'tabela_html(\n  locus_audit,\n  digits = 3,\n  caption = "Controle de qualidade dos locos SSR"\n)'),
            ('kable(\n  individual_call_rate_summary,\n  digits = 3,\n  caption = "Distribuição da taxa de chamada SSR por indivíduo"\n)', 'tabela_html(\n  individual_call_rate_summary,\n  digits = 3,\n  caption = "Distribuição da taxa de chamada SSR por indivíduo"\n)'),
            ('kable(\n  phenotype_summary,\n  digits = 3,\n  caption = "Resumo das características fenotípicas"\n)', 'tabela_html(\n  phenotype_summary,\n  digits = 3,\n  caption = "Resumo das características fenotípicas"\n)'),
            ('kable(\n  phenotype_extremes,', 'tabela_html(\n  phenotype_extremes,'),
            ('kable(\n  trait_dictionary[, c("Trait", "Description_pt", "Unit")],\n  caption = "Dicionário das características fenotípicas"\n)', 'tabela_html(\n  trait_dictionary[, c("Trait", "Description_pt", "Unit")],\n  caption = "Dicionário das características fenotípicas"\n)'),
            ('|>\n  kable(caption = "Resumo final do pré-processamento")', '|>\n  tabela_html(caption = "Resumo final do pré-processamento")')]
          for old,new in repl_pt: pt = replace_once(pt, old, new, 'PT table')

          pt = replace_once(pt, 'A coluna `BL` é retirada imediatamente após a leitura dos fenótipos para impedir que o bloco seja propagado para os objetos analíticos. A tabela exibida ao final do chunk permite conferir as dimensões das três fontes antes de qualquer alinhamento.', 'A coluna `BL` é retirada imediatamente após a leitura dos fenótipos para impedir que o bloco seja propagado para os objetos analíticos. As primeiras linhas permitem reconhecer a organização original dos dados, e a tabela de dimensões verifica a estrutura das três fontes antes do alinhamento.', 'PT read prose')
          pt = replace_once(pt, '```\n\n## 4. Organização dos dados SSR', '```\n\nA tabela de dimensões confirma que a aba `Genes` contém `r nrow(genes)` indivíduos e `r ncol(genes) - 1` colunas correspondentes aos locos SSR, além da primeira coluna de índice. A tabela fenotípica contém `r nrow(pheno_raw)` indivíduos após a remoção de `BL`. A aba `Genealex` possui uma estrutura de metadados própria e, por isso, suas dimensões não devem ser interpretadas como uma matriz de marcadores.\n\n## 4. Organização dos dados SSR', 'PT read interpretation')
          pt = replace_once(pt, '# Estrutura inicial da matriz SSR.\nssr_raw[1:6, 1:8]\n```\n\n## 5. Organização e alinhamento dos fenótipos', '# Estrutura inicial da matriz SSR.\nssr_raw[1:6, 1:8]\n```\n\nOs códigos SSR representam os dois alelos observados em cada indivíduo. Por exemplo, `12` indica um alelo 1 e um alelo 2, `22` indica duas cópias do alelo 2 e `33` indica duas cópias do alelo 3. O valor `33` observado em `P3K3256CC` não representa erro ou categoria especial: esse loco é multialélico e inclui o alelo 3 no painel. No Módulo 02, esses códigos serão decompostos em dosagens de 0, 1 ou 2 cópias para cada alelo observado.\n\n## 5. Organização e alinhamento dos fenótipos', 'PT SSR interpretation')
          pt = replace_once(pt, '# Define o contrato mínimo da tabela fenotípica antes do alinhamento.', '# Define as colunas que precisam estar presentes antes do alinhamento.', 'PT contract')
          pt = replace_once(pt, '```\n\n## 6. Controle de qualidade dos marcadores', '```\n\nAs verificações confirmam `r length(ids)` indivíduos nas duas fontes, sem indivíduos ausentes entre genótipos e fenótipos. Também são avaliados identificadores e nomes de locos ausentes ou duplicados antes do alinhamento. Após a reorganização, `FAM` contém `r nlevels(metadata$FAM)` famílias, com tamanhos entre `r min(table(metadata$FAM))` e `r max(table(metadata$FAM))` indivíduos.\n\n## 6. Controle de qualidade dos marcadores', 'PT alignment interpretation')
          pt = replace_once(pt, '```\n\nA figura ordena os locos pela taxa de chamada', '```\n\nDos `r nrow(locus_audit)` locos avaliados, `r sum(locus_audit$Keep_locus)` atendem simultaneamente aos critérios de taxa de chamada e variabilidade genotípica. O loco removido é `r paste(locus_audit$Locus[!locus_audit$Keep_locus], collapse = ", ")`; sua exclusão decorre da ausência de variação genotípica suficiente no painel, e não de remoção de indivíduos.\n\nA figura ordena os locos pela taxa de chamada', 'PT QC interpretation')
          pt = replace_once(pt, '```\n\n## 7. Resumo da informação genotípica', '```\n\nA figura mostra que a decisão de retenção não depende apenas da posição em relação à linha de 0,90. Um loco pode apresentar alta taxa de chamada e ainda ser excluído se somente uma classe genotípica estiver representada, como ocorre com o loco identificado na tabela anterior.\n\n## 7. Resumo da informação genotípica', 'PT QC figure interpretation')
          pt = replace_once(pt, '```\n\n## 8. Resumo das características fenotípicas', '```\n\nA taxa de chamada por indivíduo varia de `r sprintf("%.1f%%", 100 * min(individual_audit$Call_rate))` a `r sprintf("%.1f%%", 100 * max(individual_audit$Call_rate))`, com média de `r sprintf("%.1f%%", 100 * mean(individual_audit$Call_rate))`. Como não há regra de exclusão por indivíduo, essas diferenças são registradas apenas como informação de completude genotípica.\n\n## 8. Resumo das características fenotípicas', 'PT individual interpretation')
          pt = replace_once(pt, '```\n\n### 8.1 Observações fenotípicas distantes da média', '```\n\nTodas as dez características apresentam `r min(phenotype_summary$N)` observações disponíveis, confirmando ausência de dados fenotípicos faltantes nas variáveis analisadas. Como as características utilizam unidades e amplitudes distintas, desvios-padrão e intervalos devem ser interpretados dentro de cada característica, e não comparados diretamente entre unidades diferentes.\n\n### 8.1 Observações fenotípicas distantes da média', 'PT phenotype interpretation')
          pt = pt.replace('Esse limite serve para chamar a atenção do leitor para valores distantes da média, não para declarar erros ou outliers estatísticos.', 'Esse limite serve para destacar valores distantes da média, não para declarar erros ou outliers estatísticos.')
          pt = replace_once(pt, '```\n\n### 8.2 Dicionário das características', '```\n\nForam destacadas `r nrow(phenotype_extremes)` observações com distância padronizada de pelo menos `r PHENOTYPE_DISTANCE_THRESHOLD` desvios-padrão. Essas observações permanecem nos dados e nos modelos; a tabela apenas documenta quais valores merecem inspeção adicional.\n\n### 8.2 Dicionário das características', 'PT extremes interpretation')
          pt = replace_once(pt, '```\n\nOs histogramas complementam', '```\n\nO dicionário evidencia que produção e massa são expressas em kg, dimensões dos frutos em cm, firmeza em N e sólidos solúveis em °Brix. Essa diferença de unidades explica por que as escalas numéricas das características não devem ser comparadas diretamente.\n\nOs histogramas complementam', 'PT dictionary interpretation')
          pt = replace_once(pt, '```\n\n## 9. Gravação dos resultados do pré-processamento', '```\n\nOs histogramas permitem avaliar concentração, dispersão e assimetria dentro de cada característica. Eles são diagnósticos descritivos e não constituem testes de normalidade nem implicam transformação automática dos fenótipos.\n\n## 9. Gravação dos resultados do pré-processamento', 'PT hist interpretation')
          pt = replace_once(pt, '## 10. Próxima etapa\n\nO Módulo 02 converte os locos SSR mantidos em colunas de dosagem alélica,\nconstrói as matrizes de marcadores e de relacionamento genômico, cria a matriz\nde efeitos fixos de família e define os cinco folds da validação cruzada.', '## 10. Próxima etapa\n\nO Módulo 02 converte os locos SSR mantidos em colunas de dosagem alélica,\nconstrói as matrizes de marcadores e de relacionamento genômico, cria a matriz\nde efeitos fixos de família e define os cinco folds da validação cruzada.\n\n<div style="display:flex; justify-content:space-between; gap:1rem; margin-top:2rem; padding-top:1rem; border-top:1px solid #ddd;">\n<a href="index.html">← Início</a>\n<a href="02_matrices_pt.html">Módulo 02 — Construção das matrizes →</a>\n</div>', 'PT navigation')
          p.write_text(pt, encoding='utf-8')

          p = Path('analysis/01_preprocessing_en.Rmd')
          en = p.read_text(encoding='utf-8')
          en = replace_once(en, 'The hidden chunk below defines only the rendering options shared by this page. It does not read data, modify analytical objects, or execute any preprocessing step.\n\n', '', 'EN hidden setup')
          en = replace_once(en, 'At the end of this stage, the reader will have three central objects: the aligned phenotype matrix, the SSR matrix after locus quality control, and metadata containing individual and family. The diagnostics produced throughout the page are used to verify that these objects are ready for genomic-matrix construction.', 'Preprocessing produces three central objects for the following stages: the aligned phenotype matrix, the SSR matrix after locus quality control, and metadata containing individual and family. The diagnostics presented throughout the module verify the consistency of these objects before genomic-matrix construction.', 'EN reader objective')
          en = replace_once(en, '''## 2. Packages and file paths\n\nThe first chunk loads only the packages required for spreadsheet reading, data manipulation, figures, tables, and portable paths. Package startup messages are suppressed so that the page remains focused on the analytical steps.\n\n```{r packages}\nsuppressPackageStartupMessages({\n  library(readxl)\n  library(dplyr)\n  library(tidyr)\n  library(ggplot2)\n  library(knitr)\n  library(here)\n})\n```\n\nThe next step defines the file paths used as inputs and outputs in this module. These paths only organize data reading and result persistence and are not statistical parameters.\n\nTwo control parameters are fixed here. `CALL_RATE_MIN = 0.90` requires at least 90% of the calls at a locus to be available. Because the panel contains 150 individuals, this corresponds to at least 135 observed genotypes per locus. Together with the requirement of at least two genotype classes, the criterion avoids retaining loci with insufficient information to represent variation. `PHENOTYPE_DISTANCE_THRESHOLD = 4` flags, only for inspection, observations at least four standard deviations from the trait mean. This is a diagnostic rule: no phenotype is removed, winsorized, or otherwise altered by this threshold.''', '''## 2. Packages and file paths\n\nThe packages used in this module have distinct roles:\n\n- `readxl`: reads the Excel workbooks containing genotype and phenotype data;\n- `dplyr`: selects, transforms, and organizes tabular data;\n- `tidyr`: reshapes data between wide and long formats;\n- `ggplot2`: builds the quality-control and phenotype-distribution figures;\n- `knitr`: formats tables displayed in the tutorial;\n- `here`: builds project-relative file paths that do not depend on the local working directory.\n\n```{r packages, warning=FALSE, message=FALSE}\nlibrary(readxl)  # Read Excel workbooks.\nlibrary(dplyr)   # Manipulate and transform tables.\nlibrary(tidyr)   # Reshape data between wide and long formats.\nlibrary(ggplot2) # Build figures.\nlibrary(knitr)   # Format tables and R Markdown output.\nlibrary(here)    # Build portable project-relative paths.\n```\n\nAll tables in this module use `format_table()` for a consistent presentation. Tables occupy the available page width and use horizontal scrolling when their contents exceed that width. This helper changes presentation only; the underlying data are unchanged.\n\n```{r table-formatting}\nformat_table <- function(x, caption = NULL, digits = NULL, col.names = NULL) {\n  table <- knitr::kable(\n    x,\n    format = "html",\n    caption = caption,\n    digits = digits,\n    col.names = col.names,\n    table.attr = paste0(\n      'class="table table-striped table-hover" ',\n      'style="width:100%; margin-bottom:0;"'\n    )\n  )\n  knitr::asis_output(\n    paste0(\n      '<div style="width:100%; overflow-x:auto; margin-bottom:1.25rem;">',\n      table,\n      '</div>'\n    )\n  )\n}\n```\n\nThe paths defined below organize the input files and output directory; they are not statistical parameters.\n\nTwo control parameters are fixed:\n\n- `CALL_RATE_MIN = 0.90`: requires at least 90% of the calls at a locus to be available. Because the panel contains 150 individuals, this corresponds to at least 135 observed genotypes per locus. Together with the requirement of at least two genotype classes, the criterion avoids retaining loci with insufficient information to represent variation.\n- `PHENOTYPE_DISTANCE_THRESHOLD = 4`: flags, only for inspection, observations at least four standard deviations from the trait mean. This diagnostic rule does not remove phenotypes, cap them at a cutoff, or otherwise alter their values.''', 'EN packages')

          repl_en = [
            ('|>\n  kable(caption = "Dimensions of the spreadsheets used in the analysis")', '|>\n  format_table(caption = "Dimensions of the spreadsheets used in the analysis")'),
            ('kable(\n  alignment,\n  caption = "Alignment between genotype and phenotype data"\n)', 'format_table(\n  alignment,\n  caption = "Alignment between genotype and phenotype data"\n)'),
            ('kable(\n  identifier_summary,\n  caption = "Summary of identifiers and required columns"\n)', 'format_table(\n  identifier_summary,\n  caption = "Summary of identifiers and required columns"\n)'),
            ('|>\n  kable(caption = "Number of individuals per family")', '|>\n  format_table(caption = "Number of individuals per family")'),
            ('kable(\n  locus_audit,\n  digits = 3,\n  caption = "Quality control of SSR loci"\n)', 'format_table(\n  locus_audit,\n  digits = 3,\n  caption = "Quality control of SSR loci"\n)'),
            ('kable(\n  individual_call_rate_summary,\n  digits = 3,\n  caption = "Distribution of SSR call rate by individual"\n)', 'format_table(\n  individual_call_rate_summary,\n  digits = 3,\n  caption = "Distribution of SSR call rate by individual"\n)'),
            ('kable(\n  phenotype_summary,\n  digits = 3,\n  caption = "Summary of phenotype traits"\n)', 'format_table(\n  phenotype_summary,\n  digits = 3,\n  caption = "Summary of phenotype traits"\n)'),
            ('kable(\n  phenotype_extremes,', 'format_table(\n  phenotype_extremes,'),
            ('kable(\n  trait_dictionary[, c("Trait", "Description_en", "Unit")],\n  caption = "Dictionary of phenotype traits"\n)', 'format_table(\n  trait_dictionary[, c("Trait", "Description_en", "Unit")],\n  caption = "Dictionary of phenotype traits"\n)'),
            ('|>\n  kable(caption = "Final preprocessing summary")', '|>\n  format_table(caption = "Final preprocessing summary")')]
          for old,new in repl_en: en = replace_once(en, old, new, 'EN table')

          en = replace_once(en, 'The `BL` column is removed immediately after phenotype reading so that block is not propagated into analytical objects. The table displayed at the end of the chunk allows the dimensions of all three sources to be checked before alignment.', 'The `BL` column is removed immediately after phenotype reading so that block is not propagated into analytical objects. The first rows make the original data organization visible, and the dimensions table checks the structure of the three sources before alignment.', 'EN read prose')
          en = replace_once(en, '```\n\n## 4. Organizing the SSR data', '```\n\nThe dimensions table confirms `r nrow(genes)` individuals in the `Genes` sheet and `r ncol(genes) - 1` columns corresponding to SSR loci, in addition to the first index column. The phenotype table contains `r nrow(pheno_raw)` individuals after removing `BL`. The `Genealex` sheet has its own metadata layout, so its dimensions should not be interpreted as a marker matrix.\n\n## 4. Organizing the SSR data', 'EN read interpretation')
          en = replace_once(en, '# Initial structure of the SSR matrix.\nssr_raw[1:6, 1:8]\n```\n\n## 5. Organizing and aligning phenotypes', '# Initial structure of the SSR matrix.\nssr_raw[1:6, 1:8]\n```\n\nSSR codes represent the two alleles observed in each individual. For example, `12` denotes one copy of allele 1 and one copy of allele 2, `22` denotes two copies of allele 2, and `33` denotes two copies of allele 3. The `33` value shown for `P3K3256CC` is not an error or a special category: this locus is multi-allelic and allele 3 is represented in the panel. In Module 02, these genotype codes are decomposed into dosages of 0, 1, or 2 copies for each observed allele.\n\n## 5. Organizing and aligning phenotypes', 'EN SSR interpretation')
          en = replace_once(en, '# Define the minimum phenotype-table contract before alignment.', '# Define the columns that must be present before alignment.', 'EN contract')
          en = replace_once(en, '```\n\n## 6. Marker quality control', '```\n\nThe checks confirm `r length(ids)` individuals in both sources, with no individuals missing between genotype and phenotype data. Missing or duplicated identifiers and locus names are also evaluated before alignment. After reordering, `FAM` contains `r nlevels(metadata$FAM)` families, with family sizes ranging from `r min(table(metadata$FAM))` to `r max(table(metadata$FAM))` individuals.\n\n## 6. Marker quality control', 'EN alignment interpretation')
          en = replace_once(en, '```\n\nThe figure orders loci by call rate', '```\n\nOf the `r nrow(locus_audit)` loci evaluated, `r sum(locus_audit$Keep_locus)` satisfy both the call-rate and genotype-variation criteria. The removed locus is `r paste(locus_audit$Locus[!locus_audit$Keep_locus], collapse = ", ")`; its exclusion is due to insufficient genotype variation in the panel rather than removal of any individual.\n\nThe figure orders loci by call rate', 'EN QC interpretation')
          en = replace_once(en, '```\n\n## 7. Summary of genotype information', '```\n\nThe figure shows that retention does not depend only on position relative to the 0.90 line. A locus can have high call rate and still be excluded when only one genotype class is represented, as occurs for the locus identified in the preceding table.\n\n## 7. Summary of genotype information', 'EN QC figure interpretation')
          en = replace_once(en, '```\n\n## 8. Summary of phenotype traits', '```\n\nIndividual call rate ranges from `r sprintf("%.1f%%", 100 * min(individual_audit$Call_rate))` to `r sprintf("%.1f%%", 100 * max(individual_audit$Call_rate))`, with a mean of `r sprintf("%.1f%%", 100 * mean(individual_audit$Call_rate))`. Because no individual-exclusion rule is applied, these differences are recorded only as genotype-completeness information.\n\n## 8. Summary of phenotype traits', 'EN individual interpretation')
          en = replace_once(en, '```\n\n### 8.1 Phenotype observations far from the mean', '```\n\nAll ten traits contain `r min(phenotype_summary$N)` available observations, confirming that the analyzed phenotype variables have no missing values. Because traits use different units and ranges, standard deviations and intervals should be interpreted within each trait rather than compared directly across different measurement scales.\n\n### 8.1 Phenotype observations far from the mean', 'EN phenotype interpretation')
          en = en.replace("This threshold is used to draw the reader's attention to values far from the mean, not to declare errors or statistical outliers.", 'This threshold highlights values far from the mean; it does not declare errors or statistical outliers.')
          en = replace_once(en, '```\n\n### 8.2 Trait dictionary', '```\n\n`r nrow(phenotype_extremes)` observations are highlighted at a standardized distance of at least `r PHENOTYPE_DISTANCE_THRESHOLD` standard deviations. These observations remain in the data and in the models; the table only documents values that merit additional inspection.\n\n### 8.2 Trait dictionary', 'EN extremes interpretation')
          en = replace_once(en, '```\n\nThe histograms complement', '```\n\nThe dictionary shows that production and mass are expressed in kg, fruit dimensions in cm, firmness in N, and soluble solids in °Brix. These different units explain why the numerical scales of the traits should not be compared directly.\n\nThe histograms complement', 'EN dictionary interpretation')
          en = replace_once(en, '```\n\n## 9. Saving preprocessing results', '```\n\nThe histograms allow concentration, dispersion, and asymmetry to be examined within each trait. They are descriptive diagnostics; they are not normality tests and do not imply automatic phenotype transformation.\n\n## 9. Saving preprocessing results', 'EN hist interpretation')
          en = replace_once(en, '## 10. Next step\n\nModule 02 converts the retained SSR loci into allele-dosage columns, constructs\nthe marker and genomic relationship matrices, creates the family fixed-effect\nmatrix, and defines the five cross-validation folds.', '## 10. Next step\n\nModule 02 converts the retained SSR loci into allele-dosage columns, constructs\nthe marker and genomic relationship matrices, creates the family fixed-effect\nmatrix, and defines the five cross-validation folds.\n\n<div style="display:flex; justify-content:space-between; gap:1rem; margin-top:2rem; padding-top:1rem; border-top:1px solid #ddd;">\n<a href="index.html">← Home</a>\n<a href="02_matrices_en.html">Module 02 — Matrix construction →</a>\n</div>', 'EN navigation')
          p.write_text(en, encoding='utf-8')

          if 'suppressPackageStartupMessages' in pt or 'suppressPackageStartupMessages' in en: raise SystemExit('suppressPackageStartupMessages remains')
          for bad in ['o leitor', 'winsoriz', 'contrato mínimo', 'ao final do chunk', 'primeiro chunk']:
              if bad in pt.lower(): raise SystemExit(f'PT residual: {bad}')
          for bad in ['the reader', 'winsoriz', 'minimum phenotype-table contract', 'end of the chunk', 'first chunk']:
              if bad in en.lower(): raise SystemExit(f'EN residual: {bad}')
          if pt.count('kable(') != 1 or en.count('kable(') != 1: raise SystemExit(f'kable count PT={pt.count("kable(")} EN={en.count("kable(")}')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' analysis/01_preprocessing_en.Rmd analysis/01_preprocessing_pt.Rmd | sort)"
          test "$changed" = "$expected"

      - name: Parse R chunks and inline expressions
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/01_preprocessing_pt.Rmd', 'analysis/01_preprocessing_en.Rmd')
          total_chunks <- 0L; total_inline <- 0L
          for (f in files) {
            x <- readLines(f, warn = FALSE, encoding = 'UTF-8'); in_chunk <- FALSE; code <- character()
            for (line in x) {
              if (!in_chunk && grepl('^```\\{r', line)) { in_chunk <- TRUE; code <- character() }
              else if (in_chunk && grepl('^```\\s*$', line)) { if (length(code)) parse(text = code); total_chunks <- total_chunks + 1L; in_chunk <- FALSE }
              else if (in_chunk) code <- c(code, line)
            }
            txt <- paste(x, collapse='\n'); hits <- gregexpr('`r ([^`]+)`', txt, perl=TRUE)[[1]]
            if (hits[1] != -1) { vals <- regmatches(txt, list(hits))[[1]]; for (v in vals) parse(text = sub('^`r |`$', '', v)); total_inline <- total_inline + length(vals) }
          }
          cat('Parsed Module 01 R chunks:', total_chunks, '\n'); cat('Parsed Module 01 inline R expressions:', total_inline, '\n')
          RS

      - name: Commit validated Module 01 refinement
        shell: bash
        run: |
          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/01_preprocessing_pt.Rmd analysis/01_preprocessing_en.Rmd
          git commit -m "Apply clearer didactic standard to Module 01"
          git push origin HEAD:didactic-m01-standard
