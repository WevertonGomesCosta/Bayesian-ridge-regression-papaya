name: Validate scientific audit v2

on:
  push:
    branches:
      - scientific-product-audit

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scientific-product-audit
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Extract R chunks deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'analysis/02_matrices_en.Rmd', 'analysis/02_matrices_pt.Rmd',
              'analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd',
              'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd',
          ]

          out = Path('.audit-r-v2')
          out.mkdir(exist_ok=True)

          for f in files:
              lines = Path(f).read_text(encoding='utf-8').splitlines()
              chunks = []
              in_chunk = False
              current = []
              label = None

              for line_no, line in enumerate(lines, start=1):
                  stripped = line.strip()
                  if not in_chunk and stripped.startswith('```{r') and stripped.endswith('}'):
                      in_chunk = True
                      current = []
                      label = stripped
                      start_line = line_no + 1
                      continue
                  if in_chunk and stripped == '```':
                      chunks.append((label, start_line, current))
                      in_chunk = False
                      current = []
                      label = None
                      continue
                  if in_chunk:
                      current.append(line)

              if in_chunk:
                  raise RuntimeError(f'Unclosed R chunk in {f}: {label}')
              if not chunks:
                  raise RuntimeError(f'No R chunks found in {f}')

              stem = Path(f).stem
              for i, (label, start_line, code) in enumerate(chunks, start=1):
                  target = out / f'{stem}__{i:02d}.R'
                  target.write_text('\n'.join(code) + '\n', encoding='utf-8')
                  print(f'{target}: source line {start_line}; {label}')

          # Diagnostic guard against content that is not in the audited source.
          for p in out.glob('*.R'):
              txt = p.read_text(encoding='utf-8')
              if 'family_levels' in txt or 'intercept_present' in txt:
                  raise RuntimeError(f'Unexpected extracted content in {p}')
          PY

      - name: Parse every R chunk independently
        shell: bash
        run: |
          set -euo pipefail
          for f in .audit-r-v2/*.R; do
            echo "Parsing $f"
            Rscript -e "parse(file='$f'); cat('OK\n')" >/dev/null
          done
          echo "All extracted R chunks parsed successfully."

      - name: Check tutorial invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              'analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd',
              'analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd',
          ]
          sources = '\n'.join(Path(p).read_text(encoding='utf-8') for p in paths)

          forbidden = [
              'positive_p_lt_0.05', 'positive_p_ge_0.05',
              'nonpositive_p_ge_0.05', 'automatic_supported',
              'rrblup_preferred_among_equivalent_models',
              'best_non_rrblup_equivalent_model',
              'showed numerical instability', 'apresentar instabilidade numérica'
          ]
          bad = [x for x in forbidden if x in sources]
          if bad:
              raise RuntimeError(f'Forbidden source residues: {bad}')

          for path in ['analysis/03_models_en.Rmd', 'analysis/03_models_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              for chunk in ['fit-models', 'assemble-fit-results', 'save-results']:
                  token = f'```{{r {chunk}, eval=FALSE}}'
                  if token not in text:
                      raise RuntimeError(f'{path}: missing protected chunk {token}')

          for path in ['analysis/04_results_en.Rmd', 'analysis/04_results_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              required = [
                  'OOF_predictive_direction',
                  'filter(OOF_predictive_direction == "positive")',
                  'selection_eligible_traits',
                  'DIC_COMPETITIVE_THRESHOLD',
                  'Operational_competitive_set_rule'
              ]
              missing = [x for x in required if x not in text]
              if missing:
                  raise RuntimeError(f'{path}: missing audited constructs {missing}')

          for path in ['analysis/05_results_en.Rmd', 'analysis/05_results_pt.Rmd']:
              text = Path(path).read_text(encoding='utf-8')
              if 'm04$selection_eligible_traits' not in text:
                  raise RuntimeError(f'{path}: M04/M05 interface is not aligned')

          print('All scientific-audit invariants passed.')
          PY

          git diff --check main...HEAD

      - name: Remove temporary validation workflows
        shell: bash
        run: |
          rm -rf .audit-r-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-scientific-audit.yml
          git rm .github/workflows/validate-scientific-audit-v2.yml
          git commit -m "Complete scientific source validation"
          git push origin HEAD:scientific-product-audit
