name: Refine OOF ranking interpretation v4

on:
  push:
    branches:
      - refine-oof-ranking-interpretation

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-oof-ranking-interpretation
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Apply audited source transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('analysis/05_results_pt.Rmd')
          text = p.read_text(encoding='utf-8')
          old = '`N_traits`, frequência de seleção e ranks\n'
          new = '`N_traits`, frequência de seleção e rankings\n'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one PT recurrence wording anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          awk '
            /- name: Refine Modules 04 and 05/ {in_step=1; next}
            in_step && /python - <<'\''PY'\''/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/refine-oof-ranking-v3.yml > /tmp/refine_oof.py

          test -s /tmp/refine_oof.py
          python /tmp/refine_oof.py

      - name: Validate source and R syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          out = Path('.audit-r'); out.mkdir(exist_ok=True)
          files = [
              'analysis/04_results_en.Rmd','analysis/04_results_pt.Rmd',
              'analysis/05_results_en.Rmd','analysis/05_results_pt.Rmd'
          ]
          all_text = '\n'.join(Path(f).read_text(encoding='utf-8') for f in files)
          if 'selection_eligible_traits' in all_text:
              raise RuntimeError('Old eligibility variable remains')
          for token in [
              'positive_oof_traits', 'OOF_nominal_signal',
              'positive_nominal_p_lt_0.05', 'positive_nominal_p_ge_0.05',
              'OOF_nominal_p_value'
          ]:
              if token not in all_text:
                  raise RuntimeError(f'Missing expected construct: {token}')
          for f in files:
              chunks=[]; current=None
              for line in Path(f).read_text(encoding='utf-8').splitlines():
                  s=line.strip()
                  if current is None and s.startswith('```{r') and s.endswith('}'):
                      current=[]; continue
                  if current is not None and s == '```':
                      chunks.append(current); current=None; continue
                  if current is not None:
                      current.append(line)
              if current is not None:
                  raise RuntimeError(f'Unclosed R chunk: {f}')
              for i, code in enumerate(chunks,1):
                  (out/f'{Path(f).stem}_{i:02d}.R').write_text('\n'.join(code)+'\n', encoding='utf-8')
              print(f'{f}: {len(chunks)} chunks')
          PY

          Rscript --vanilla -e '
            fs <- list.files(".audit-r", pattern="[.]R$", full.names=TRUE)
            stopifnot(length(fs) > 0)
            for (f in fs) parse(file=f)
            cat("Parsed", length(fs), "R chunks successfully.\n")
          '
          rm -rf .audit-r

          git add analysis/04_results_en.Rmd analysis/04_results_pt.Rmd analysis/05_results_en.Rmd analysis/05_results_pt.Rmd
          git diff --cached --check

      - name: Commit only audited source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/refine-oof-ranking.yml \
            .github/workflows/refine-oof-ranking-v2.yml \
            .github/workflows/refine-oof-ranking-v3.yml \
            .github/workflows/refine-oof-ranking-v4.yml
          git commit -m "Clarify exploratory OOF candidate rankings"
          git push origin HEAD:refine-oof-ranking-interpretation
