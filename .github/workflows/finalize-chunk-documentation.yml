name: Finalize semantic chunk documentation

on:
  push:
    branches:
      - chunk-documentation-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply context-specific documentation edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CHUNK_RE = re.compile(r'^\s*```\{r(?:[\s,}]|$)')
          END_RE = re.compile(r'^\s*```\s*$')

          first_comment_map_pt = {
              'grafico-qualidade-marcadores': '# Constrói o gráfico de taxa de chamada dos locos e destaca o limite mínimo de qualidade.',
              'inventario-final': '# Resume as dimensões finais e as contagens de dados ausentes ou destacados no pré-processamento.',
              'resumo-entrada': '# Resume as dimensões e categorias do objeto de pré-processamento recebido pelo módulo.',
              'codificacao-dosagens': '# Expande cada loco multialélico em colunas de dosagem por alelo e registra a origem de cada coluna.',
              'controle-frequencias-alelicas': '# Calcula frequência e variabilidade das dosagens para filtrar colunas alélicas informativas.',
              'grafico-frequencias-alelicas': '# Mostra a distribuição das frequências alélicas e os limites usados no filtro.',
              'matriz-marcadores': '# Imputa dosagens ausentes pelas médias, centraliza as colunas e constrói a matriz de marcadores M.',
              'resumo-matriz-g': '# Resume o denominador, a diagonal, a simetria e o menor autovalor da matriz genômica G.',
              'grafico-familias-folds': '# Reorganiza a tabela família × fold e constrói o gráfico de distribuição dos indivíduos.',
              'grafico-relacionamento-genomico': '# Converte G para formato longo e constrói o mapa de calor do relacionamento genômico.',
              'diagnostico-matrizes': '# Verifica dimensões, postos, dependências lineares e propriedades numéricas de X, M e G.',
              'salvamento-objetos-matriciais': '# Reúne matrizes, metadados, frequências e folds no objeto persistido pelo módulo.',
              'selection-winners': '# Define o limite de DIC e identifica, para cada característica, os vencedores preditivo e por DIC.',
              'selection-competitive-set': '# Combina desempenho, DIC e diagnósticos MCMC para definir o conjunto competitivo de cada característica.',
              'selected-oof-genomic-values': '# Define a direção desejada de seleção e associa os valores genômicos OOF ao método escolhido em cada característica.',
              'genomic-ranking': '# Orienta os valores genômicos pelo objetivo de seleção e ranqueia os indivíduos dentro de cada característica.',
              'selected-mu-data': '# Converte o burn-in para a escala das amostras salvas e prepara os traces e densidades posteriores de mu.',
              'selected-fold-figure': '# Acrescenta rótulos aos resultados por fold e constrói a figura de estabilidade do método selecionado.',
              'oof-correlation-figure': '# Reorganiza a matriz de correlações OOF e constrói o mapa de calor entre características.',
              'proportional-selection-table': '# Integra objetivo de seleção, evidência OOF e tamanho do ranking exploratório de cada característica.',
              'recurrence-distribution-table': '# Traduz as classes de recorrência e prepara sua distribuição para apresentação.',
              'recurrent-candidates-table': '# Mantém os candidatos recorrentes em pelo menos três características para a tabela principal.',
          }
          first_comment_map_en = {
              'marker-quality-plot': '# Build the locus call-rate figure and highlight the minimum quality-control threshold.',
              'final-summary': '# Summarize final dimensions and counts of missing or highlighted observations from preprocessing.',
              'input-summary': '# Summarize the dimensions and categories of the preprocessing object received by the module.',
              'dosage-coding': '# Expand each multiallelic locus into allele-dosage columns and record the origin of each column.',
              'allele-frequency-control': '# Compute dosage frequency and variability to retain informative allele columns.',
              'allele-frequency-plot': '# Display the allele-frequency distribution and the thresholds used by the filter.',
              'marker-matrix': '# Impute missing dosages by column means, center the columns, and construct marker matrix M.',
              'g-matrix-summary': '# Summarize the denominator, diagonal, symmetry, and minimum eigenvalue of genomic matrix G.',
              'family-fold-plot': '# Reshape the family-by-fold table and build the individual-distribution figure.',
              'genomic-relationship-plot': '# Reshape G to long format and build the genomic-relationship heatmap.',
              'matrix-diagnostics': '# Check dimensions, ranks, linear dependencies, and numerical properties of X, M, and G.',
              'save-matrix-objects': '# Collect matrices, metadata, frequencies, and folds in the object persisted by the module.',
              'selection-winners': '# Define the DIC threshold and identify the predictive and DIC winners for each trait.',
              'selection-competitive-set': '# Combine performance, DIC, and MCMC diagnostics to define the competitive set for each trait.',
              'selected-oof-genomic-values': '# Define the desired selection direction and link OOF genomic values to the selected method for each trait.',
              'genomic-ranking': '# Orient genomic values by the selection objective and rank individuals within each trait.',
              'selected-mu-data': '# Convert burn-in to the saved-sample scale and prepare posterior mu traces and densities.',
              'selected-fold-figure': '# Add labels to fold-level results and build the stability figure for the selected method.',
              'oof-correlation-figure': '# Reshape the OOF correlation matrix and build the cross-trait heatmap.',
              'proportional-selection-table': '# Combine the selection objective, OOF evidence, and exploratory ranking size for each trait.',
              'recurrence-distribution-table': '# Translate recurrence classes and prepare their distribution for presentation.',
              'recurrent-candidates-table': '# Retain candidates recurring in at least three traits for the main table.',
          }

          def parse_chunks(lines):
              out = []
              i = 0
              while i < len(lines):
                  if not CHUNK_RE.match(lines[i]):
                      i += 1
                      continue
                  s = i
                  j = i + 1
                  while j < len(lines) and not END_RE.match(lines[j]):
                      j += 1
                  inside = lines[s].split('{r', 1)[1].rsplit('}', 1)[0].strip()
                  label = inside.split(',', 1)[0].strip() if inside else 'unnamed'
                  out.append((s, j, label or 'unnamed'))
                  i = j + 1
              return out

          for path in sorted(Path('analysis').glob('0[1-5]*.Rmd')):
              lines = path.read_text(encoding='utf-8').splitlines()
              pt = path.name.endswith('_pt.Rmd')
              mapping = first_comment_map_pt if pt else first_comment_map_en
              for start, end, label in parse_chunks(lines):
                  if label not in mapping:
                      continue
                  # Replace the first ordinary code comment in this chunk; the
                  # comments targeted here were introduced by the documentation audit.
                  for i in range(start + 1, end):
                      s = lines[i].lstrip()
                      if s.startswith('#') and not s.startswith('#|'):
                          indent = lines[i][:len(lines[i]) - len(s)]
                          lines[i] = indent + mapping[label]
                          break
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          replacements = {
              # M01 graph threshold.
              '# Define os valores de `yintercept` usados nesta estrutura.': '# Adiciona a linha horizontal que representa o limite mínimo de taxa de chamada.',
              '# Define the `yintercept` values used in this structure.': '# Add the horizontal line representing the minimum call-rate threshold.',

              # M02 duplicated locus comment: keep the original explanatory line.
              '  # Identifica as colunas de dosagem retidas que pertencem ao loco corrente.\n': '',
              '  # Identify retained dosage columns that belong to the current locus.\n': '',

              # M04 table and model-comparison details.
              '  # Registra os valores de `Caracteristicas` que completam esta estrutura.': '  # Conta quantas características estão representadas em cada tabela de entrada.',
              '  # Record the `Traits` values that complete this structure.': '  # Count how many traits are represented in each input table.',
              '    # Define os valores de `ER` usados nesta estrutura.': '    # Calcula a razão de evidência relativa ao método de maior Wprob em cada característica.',
              '    # Define the `ER` values used in this structure.': '    # Compute the evidence ratio relative to the method with the largest Wprob in each trait.',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nselection_spec <-': '# Aplica a prioridade do RR-BLUP dentro do conjunto automático e define o método selecionado.\nselection_spec <-',
              '# Derive the structure used to prioritize or summarize candidates.\nselection_spec <-': '# Apply RR-BLUP priority within the automatic set and define the selected method.\nselection_spec <-',
              '    # Registra os valores de `by` que completam esta estrutura.\n    by = c("Trait", "Selected_method" = "Method")': '    by = c("Trait", "Selected_method" = "Method")',
              '    # Record the `by` values that complete this structure.\n    by = c("Trait", "Selected_method" = "Method")': '    by = c("Trait", "Selected_method" = "Method")',
              '    # Registra os valores de `by` que completam esta estrutura.\n    by = c("Trait", "Selected_method")': '    by = c("Trait", "Selected_method")',
              '    # Record the `by` values that complete this structure.\n    by = c("Trait", "Selected_method")': '    by = c("Trait", "Selected_method")',
              '# Define o caminho ou local associado a `oof_direction_summary`.': '# Conta quantas características apresentam correlação OOF positiva ou não positiva.',
              '# Define the path or location associated with `oof_direction_summary`.': '# Count how many traits have positive or nonpositive OOF correlation.',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nSELECTION_PROPORTION <-': '# Define a proporção de candidatos exibida em cada ranking exploratório.\nSELECTION_PROPORTION <-',
              '# Derive the structure used to prioritize or summarize candidates.\nSELECTION_PROPORTION <-': '# Define the candidate proportion displayed in each exploratory ranking.\nSELECTION_PROPORTION <-',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nselection_sizes <-': '# Calcula quantos indivíduos compõem a proporção priorizada em cada característica com OOF positivo.\nselection_sizes <-',
              '# Derive the structure used to prioritize or summarize candidates.\nselection_sizes <-': '# Compute how many individuals compose the prioritized proportion in each positive-OOF trait.\nselection_sizes <-',
              '# Resume os resultados no objeto `selection_cutoff_summary`.': '# Registra o escore de corte e o intervalo de valores genômicos correspondente a cada ranking.',
              '# Summarize the results in `selection_cutoff_summary`.': '# Record the cutoff score and genomic-value interval corresponding to each ranking.',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nmultitrait_recurrence <-': '# Integra a contagem de recorrência aos metadados e calcula frequência e classe de recorrência.\nmultitrait_recurrence <-',
              '# Derive the structure used to prioritize or summarize candidates.\nmultitrait_recurrence <-': '# Join recurrence counts to metadata and compute recurrence frequency and class.\nmultitrait_recurrence <-',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nrecurrence_distribution <-': '# Resume quantos indivíduos pertencem a cada classe de recorrência.\nrecurrence_distribution <-',
              '# Derive the structure used to prioritize or summarize candidates.\nrecurrence_distribution <-': '# Summarize how many individuals belong to each recurrence class.\nrecurrence_distribution <-',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\ncandidate_rank_wide <-': '# Reorganiza os ranks por característica para uma linha por candidato recorrente.\ncandidate_rank_wide <-',
              '# Derive the structure used to prioritize or summarize candidates.\ncandidate_rank_wide <-': '# Reshape trait-specific ranks to one row per recurrent candidate.\ncandidate_rank_wide <-',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nmultitrait_candidates <-': '# Mantém candidatos recorrentes em pelo menos duas características e anexa seus ranks específicos.\nmultitrait_candidates <-',
              '# Derive the structure used to prioritize or summarize candidates.\nmultitrait_candidates <-': '# Retain candidates recurring in at least two traits and attach their trait-specific ranks.\nmultitrait_candidates <-',
              '# Agrupa configurações, resultados e diagnósticos no objeto final do módulo.\nwrite.csv(model_comparison': '# Grava as tabelas derivadas pelo módulo antes de montar o objeto RDS consolidado.\nwrite.csv(model_comparison',
              '# Collect settings, results, and diagnostics in the final module object.\nwrite.csv(model_comparison': '# Save the tables derived by the module before assembling the consolidated RDS object.\nwrite.csv(model_comparison',

              # M05 input labels and plotting details.
              '# Resume os resultados no objeto `rrblup_heritability_summary`.': '# Recupera o resumo de herdabilidade derivado no M04.',
              '# Summarize the results in `rrblup_heritability_summary`.': '# Retrieve the heritability summary derived in M04.',
              '# Constrói `method_labels` com a informação necessária para a operação seguinte.': '# Define os rótulos legíveis dos métodos usados nas tabelas e figuras.',
              '# Build `method_labels` with the information required by the next operation.': '# Define readable method labels used in tables and figures.',
              '# Constrói `method_colors` com a informação necessária para a operação seguinte.': '# Define a paleta fixa usada para distinguir os métodos nas figuras.',
              '# Build `method_colors` with the information required by the next operation.': '# Define the fixed palette used to distinguish methods in figures.',
              '# Calcula as correlações usadas para comparar características ou resultados.\npredictive_plot <-': '# Ordena os métodos e constrói o gráfico de correlação OOF por característica.\npredictive_plot <-',
              '# Compute the correlations used to compare traits or results.\npredictive_plot <-': '# Order methods and build the OOF-correlation figure by trait.\npredictive_plot <-',
              '      # Define os valores de `Selection_status` usados nesta estrutura.': '      # Traduz o status interno de seleção para o rótulo apresentado ao leitor.',
              '      # Define the `Selection_status` values used in this structure.': '      # Translate the internal selection status to the label presented to the reader.',
              '    # Define os valores de `DIC_winner` usados nesta estrutura.': '    # Mantém o vencedor por DIC com o rótulo legível do método.',
              '    # Define the `DIC_winner` values used in this structure.': '    # Keep the DIC winner using the readable method label.',
              '  # Constrói `density_object` com a informação necessária para a operação seguinte.': '  # Estima a densidade posterior de mu para o método selecionado nesta característica.',
              '  # Build `density_object` with the information required by the next operation.': '  # Estimate the posterior density of mu for the selected method in this trait.',
              '# Constrói `correlation_long` com a informação necessária para a operação seguinte.\ncorrelation_long <- correlation_long |>': '# Formata os rótulos das correlações exibidos nas células do mapa de calor.\ncorrelation_long <- correlation_long |>',
              '# Build `correlation_long` with the information required by the next operation.\ncorrelation_long <- correlation_long |>': '# Format the correlation labels displayed in the heatmap cells.\ncorrelation_long <- correlation_long |>',
              '# Constrói `correlation_plot` com a informação necessária para a operação seguinte.': '# Constrói o mapa de calor das correlações entre valores genômicos OOF.',
              '# Build `correlation_plot` with the information required by the next operation.': '# Build the heatmap of correlations among OOF genomic values.',
              '    # Registra os valores de `limits` que completam esta estrutura.': '    # Mantém a escala de cores fixa no intervalo teórico de correlação [-1, 1].',
              '    # Record the `limits` values that complete this structure.': '    # Keep the color scale fixed to the theoretical correlation range [-1, 1].',
              '# Deriva os rankings ou resumos de seleção a partir dos resultados preditivos.\nselection_sizes_display <-': '# Integra objetivo de seleção e evidência OOF ao tamanho do ranking de cada característica.\nselection_sizes_display <-',
              '# Derive selection rankings or summaries from the predictive results.\nselection_sizes_display <-': '# Combine the selection objective and OOF evidence with the ranking size for each trait.\nselection_sizes_display <-',
              '# Deriva a estrutura usada para priorizar ou resumir os candidatos.\nrecurrence_distribution_display <-': '# Traduz as classes de recorrência e calcula a distribuição apresentada na tabela.\nrecurrence_distribution_display <-',
              '# Derive the structure used to prioritize or summarize candidates.\nrecurrence_distribution_display <-': '# Translate recurrence classes and compute the distribution displayed in the table.\nrecurrence_distribution_display <-',
              '# Deriva os rankings ou resumos de seleção a partir dos resultados preditivos.\nmain_multitrait_candidates <-': '# Mantém candidatos recorrentes em pelo menos três características para a tabela principal.\nmain_multitrait_candidates <-',
              '# Derive selection rankings or summaries from the predictive results.\nmain_multitrait_candidates <-': '# Retain candidates recurring in at least three traits for the main table.\nmain_multitrait_candidates <-',
          }

          for path in sorted(Path('analysis').glob('0[1-5]*.Rmd')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Audit coverage and reject known weak annotations
        shell: bash
        run: |
          if grep -R -n -E 'Define o caminho ou local associado a `oof_direction_summary`|Define the path or location associated with `oof_direction_summary`|Constrói `method_labels` com a informação necessária|Build `method_labels` with the information required|Constrói `correlation_plot` com a informação necessária|Build `correlation_plot` with the information required|Constri?ói ou verifica as matrizes usadas na predição genômica\.\ngenomic_ranking' analysis/0*.Rmd; then
            echo 'Known weak annotations remain.'
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import math, re
          CHUNK_RE = re.compile(r'^\s*```\{r(?:[\s,}]|$)')
          END_RE = re.compile(r'^\s*```\s*$')
          HEADING_RE = re.compile(r'^\s*#{1,6}\s+')
          WORD_RE = re.compile(r'[A-Za-zÀ-ÖØ-öø-ÿ]{2,}')
          failures=[]; total=large=0
          for path in sorted(Path('analysis').glob('*.Rmd')):
              lines=path.read_text(encoding='utf-8').splitlines(); i=0; prev=-1
              while i < len(lines):
                  if not CHUNK_RE.match(lines[i]): i+=1; continue
                  s=i; j=i+1
                  while j<len(lines) and not END_RE.match(lines[j]): j+=1
                  total+=1
                  prose=any(len(WORD_RE.findall(x.strip()))>=5 and not HEADING_RE.match(x.strip()) and not x.strip().startswith(('```','<!--','-->','<div','</div','$$','\\[','\\]','---','|',':--')) for x in lines[prev+1:s] if x.strip())
                  if not prose: failures.append(f'{path}:{s+1}: missing prose')
                  body=lines[s+1:j]; code_n=sum(1 for x in body if x.strip() and not x.lstrip().startswith('#'))
                  if code_n>=15:
                      large+=1; comments=sum(1 for x in body if x.lstrip().startswith('#') and not x.lstrip().startswith('#|')); req=max(2,math.ceil(code_n/15))
                      if comments<req: failures.append(f'{path}:{s+1}: comments={comments}/{req}')
                  prev=j; i=j+1
          print(f'Audited chunks: {total}; large chunks: {large}')
          if failures: raise SystemExit('\n'.join(failures))
          print('PASS: documentation coverage preserved.')
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse all chunks and commit
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- list.files('analysis', pattern='\\.Rmd$', full.names=TRUE)
          n <- 0L
          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at ', s)
              e <- s + e_rel
              code <- if (e>s+1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code); n <- n+1L
            }
          }
          stopifnot(n==217L)
          cat('Parsed R chunks:', n, '\n')
          RS

          git diff --check
          rm -f .github/workflows/finalize-chunk-documentation.yml

          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed={f'analysis/{m}_{lang}.Rmd' for m in ['01_preprocessing','02_matrices','03_models','04_results','05_results'] for lang in ['en','pt']}
          allowed.add('.github/workflows/finalize-chunk-documentation.yml')
          bad=[p for p in changed if p not in allowed]
          if bad: raise SystemExit('Unexpected files:\n'+'\n'.join(bad))
          PY

          git config user.name "WevertonGomesCosta"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add -A
          git commit -m "Finalize semantic chunk documentation"
          git push origin HEAD:chunk-documentation-audit
