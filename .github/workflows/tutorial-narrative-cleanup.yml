name: Tutorial narrative cleanup

on:
  push:
    branches:
      - chore/tutorial-narrative-cleanup
    paths:
      - .github/workflows/tutorial-narrative-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/tutorial-narrative-cleanup

      - name: Update Module 03 narrative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("analysis/03_models_pt.Rmd"): [
                  (
                      "Após os 350 ajustes, as listas preenchidas no laço são reunidas nas quatro\n"
                      "tabelas que alimentam os diagnósticos e os módulos seguintes. Em uma reanálise\n"
                      "completa, este bloco deve ser executado imediatamente após `fit-models`.",
                      "Ao final do laço, as listas preenchidas são reunidas nas quatro tabelas que\n"
                      "alimentam os diagnósticos e os módulos seguintes. A consolidação abaixo é a\n"
                      "continuação direta de `fit-models`."
                  ),
                  (
                      "Para publicar o tutorial sem repetir os 350 ajustes, os blocos `fit-models` e\n"
                      "`assemble-fit-results` permanecem com `eval=FALSE`. Nesta renderização, as\n"
                      "saídas científicas já produzidas são lidas diretamente de `output/models/`.\n"
                      "Em uma reanálise completa, essas mesmas saídas são criadas pela etapa 9.1\n"
                      "antes de serem lidas abaixo.",
                      "As tabelas produzidas pelo ajuste são lidas de `output/models/` para os\n"
                      "diagnósticos e resumos apresentados a seguir."
                  ),
              ],
              Path("analysis/03_models_en.Rmd"): [
                  (
                      "After the 350 fits, the lists populated inside the loop are combined into the\n"
                      "four tables used by the diagnostics and downstream modules. In a complete\n"
                      "reanalysis, this block must be run immediately after `fit-models`.",
                      "At the end of the loop, the populated lists are combined into the four tables\n"
                      "used by the diagnostics and downstream modules. The block below is the direct\n"
                      "continuation of `fit-models`."
                  ),
                  (
                      "To publish the tutorial without repeating the 350 fits, the `fit-models` and\n"
                      "`assemble-fit-results` blocks remain at `eval=FALSE`. During rendering, the\n"
                      "existing scientific outputs are read directly from `output/models/`. In a\n"
                      "complete reanalysis, those same outputs are created in Section 9.1 before\n"
                      "they are read below.",
                      "The tables produced by model fitting are read from `output/models/` for the\n"
                      "diagnostics and summaries presented below."
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected one occurrence in {path}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          # This workflow is temporary and is removed from the resulting branch state.
          Path(".github/workflows/tutorial-narrative-cleanup.yml").unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/03_models_pt.Rmd analysis/03_models_en.Rmd .github/workflows/tutorial-narrative-cleanup.yml
          git diff --cached --check
          git commit -m "Align Module 03 with tutorial narrative"
          git push origin HEAD:chore/tutorial-narrative-cleanup
