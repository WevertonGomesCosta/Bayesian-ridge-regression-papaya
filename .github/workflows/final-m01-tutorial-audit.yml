      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Parse all Module 01 R chunks and inline expressions
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c('analysis/01_preprocessing_pt.Rmd', 'analysis/01_preprocessing_en.Rmd')
          n_chunks <- 0L
          n_inline <- 0L

          for (f in files) {
            x <- readLines(f, warn=FALSE, encoding='UTF-8')
            inside <- FALSE
            prose <- character()

            for (line in x) {
              if (grepl('^\\s*```\\{r(?:[\\s,}]|$)', line, perl=TRUE)) {
                inside <- TRUE
                next
              }
              if (inside && grepl('^\\s*```\\s*$', line, perl=TRUE)) {
                inside <- FALSE
                next
              }
              if (!inside) prose <- c(prose, line)
            }

            inline <- unlist(regmatches(prose, gregexpr('`r [^`]+`', prose, perl=TRUE)))
            if (length(inline)) {
              for (expr in inline) {
                parse(text=sub('^`r |`$', '', expr))
                n_inline <- n_inline + 1L
              }
            }

            starts <- grep('^\\s*```\\{r(?:[\\s,}]|$)', x, perl=TRUE)
            for (s in starts) {
              e_rel <- which(grepl('^\\s*```\\s*$', x[(s+1L):length(x)], perl=TRUE))[1]
              if (is.na(e_rel)) stop('Unclosed chunk in ', f, ' at line ', s)
              e <- s + e_rel
              code <- if (e > s + 1L) x[(s+1L):(e-1L)] else character()
              code <- code[!grepl('^\\s*#\\|', code)]
              parse(text=code)
              n_chunks <- n_chunks + 1L
            }
          }

          cat('Parsed Module 01 R chunks:', n_chunks, '\n')
          cat('Parsed Module 01 inline R expressions:', n_inline, '\n')
          RS

      - name: Commit source refinement and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-m01-tutorial-audit.yml

          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'analysis/01_preprocessing_pt.Rmd',
              'analysis/01_preprocessing_en.Rmd',
              '.github/workflows/final-m01-tutorial-audit.yml',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected changed files: {sorted(changed)}')
          PY

