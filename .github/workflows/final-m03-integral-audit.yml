name: Final Module 03 integral didactic audit

on:
  push:
    branches:
      - final-m03-integral-audit

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Run Module 03 integral didactic audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-m03-integral-audit
          fetch-depth: 0

      - name: Apply didactic refinements
        shell: bash
        run: |
          python .github/scripts/m03_integral_didactic_audit.py
          # Restore the internal helper call after replacing all public kable() calls.
          sed -i 's/knitr::tabela_html(/knitr::kable(/g' analysis/03_models_pt.Rmd
          sed -i 's/knitr::format_table(/knitr::kable(/g' analysis/03_models_en.Rmd
          git diff --check

      - name: Validate scientific-code preservation and editorial scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          files = ['analysis/03_models_pt.Rmd', 'analysis/03_models_en.Rmd']
          heavy = ['fit-models', 'assemble-fit-results', 'save-results']

          def extract(text, label):
              pat = re.compile(r"```\{r\s+" + re.escape(label) + r",\s*eval=FALSE\}.*?\n```", re.S)
              m = pat.search(text)
              if not m:
                  raise SystemExit(f'missing eval=FALSE chunk: {label}')
              return m.group(0)

          for path in files:
              current = Path(path).read_text(encoding='utf-8')
              base = subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)
              for label in heavy:
                  if extract(current, label) != extract(base, label):
                      raise SystemExit(f'heavy chunk changed: {path}::{label}')
              eval_headers = re.findall(r"```\{r[^}]*eval=FALSE[^}]*\}", current)
              if len(eval_headers) != 3:
                  raise SystemExit(f'unexpected eval=FALSE chunk count in {path}: {len(eval_headers)}')
              bad = [
                  'suppressPackageStartupMessages',
                  'O chunk oculto', 'The hidden chunk',
                  'O primeiro chunk', 'The first chunk',
                  'ponto de controle', 'checkpoint between',
                  'neste tutorial', 'In this tutorial',
                  'nome usado no tutorial', 'name used in the tutorial',
                  'o tutorial mapeia', 'the tutorial maps',
                  'exibição no tutorial', 'display in the tutorial',
              ]
              for term in bad:
                  if term.lower() in current.lower():
                      raise SystemExit(f'residual meta wording in {path}: {term}')
              scrub = current.replace('knitr::kable(', '')
              if re.search(r'(?<![A-Za-z0-9_])kable\(', scrub):
                  raise SystemExit(f'direct kable() call remains in {path}')
              nav = '04_results_pt.html' if path.endswith('_pt.Rmd') else '04_results_en.html'
              if nav not in current:
                  raise SystemExit(f'missing next navigation in {path}')

          print('Validation passed for source files.')
          PY

      - name: Commit validated source revision
        shell: bash
        run: |
          git config user.name "Weverton Gomes da Costa"
          git config user.email "95870682+WevertonGomesCosta@users.noreply.github.com"
          git add analysis/03_models_pt.Rmd analysis/03_models_en.Rmd
          git commit -m "Complete integral didactic audit of Module 03"
          git push origin HEAD:final-m03-integral-audit
